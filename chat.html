        el.readonly.hidden = false;
        el.readonly.textContent = "فقط مدیران می‌توانند در این کانال اطلاعیه منتشر کنند.";
    }

    // پروفایل (عکس + بیوگرافی) کانال پایگاه و گروه‌ها
    const channelProfileId = groupId ? groupId : (channelId === "announcements" ? "chan-ann" : (channelId ? "chan-" + channelId : null));
    const canEditChannel = !!channelProfileId &&
        (isAdmin || (channelId === "announcements" ? isManager : managerRing === channelId));
    const channelTitle = el.title.textContent;

    // مدیر کل همه را؛ مدیر حلقه پیام‌های کانال پایگاه و حلقهٔ خودش را حذف می‌کند
    const canModerate = !otherId && !groupId && channelId !== "announcements" && (isAdmin || (!!managerRing && channelId === managerRing));

    /* ---------- محتوای پیام ---------- */

    function parseContent(row) {
        const info = { text: "", fileId: "", kind: "", size: 0, reply: null, edited: false, fw: null, posterId: "", dur: 0 };
        const raw = row.content || "";

        if (raw.startsWith('{"_m":1')) {
            try {
                const o = JSON.parse(raw);
                info.text = o.t || "";
                info.fileId = o.f || "";
                info.kind = o.k || "";
                info.size = o.s || 0;
                info.reply = o.r || null;
                info.edited = !!o.e;
                info.fw = o.fw ? (o.fw.n || "پیام") : null;
                info.posterId = o.p || "";
                info.dur = o.d || 0;
            } catch (_) { info.text = raw; }
        } else {
            info.text = raw;
        }

        if (row.pendingKind) info.kind = row.pendingKind;
        if (row.pendingReply) info.reply = row.pendingReply;
        info.localUrl = row.localUrl || "";
        return info;
    }

    function buildContent(o) {
        if (!o.fileId && !o.reply && !o.edited) return o.text;
        const out = { _m: 1, t: o.text };
        if (o.fileId) { out.f = o.fileId; out.k = o.kind; out.s = o.size; }
        if (o.reply) out.r = o.reply;
        if (o.edited) out.e = 1;
        return JSON.stringify(out);
    }

    function snippetOf(info) {
        return (info.text || (info.kind === "video" ? "🎬 ویدیو" : info.kind === "image" ? "📷 تصویر" : "")).slice(0, 60);
    }

    /* ---------- فهرست پیام‌ها (در حافظه) ---------- */

    let currentRows = [];
    let lastSignature = null;
    const renderedIds = new Set();

    const timeOf = row => new Date(row.$createdAt).getTime();

    function upsert(row) {
        const i = currentRows.findIndex(r => r.$id === row.$id);
        if (i >= 0) {
            // نسخهٔ محلی (پیش‌نمایش عکس) حفظ می‌شود
            row.localUrl = row.localUrl || currentRows[i].localUrl;
            currentRows[i] = row;
        } else {
            currentRows.push(row);
        }
        currentRows.sort((a, b) => timeOf(a) - timeOf(b));
    }

    function megabytes(bytes) {
        return (bytes / 1048576).toLocaleString("fa-IR", { maximumFractionDigits: 1 }) + " مگابایت";
    }

    function buildMedia(info) {
        const wrap = document.createElement("div");
        wrap.className = "chat-media";

        const setImage = url => {
            wrap.replaceChildren();
            const img = document.createElement("img");
            img.src = url;
            img.alt = "تصویر";
            img.addEventListener("click", () => {
                if (Date.now() - lastLongPress < 700) return;
                openImageViewer(url, "photo-" + Date.now(), info.fileId);
            });
            wrap.appendChild(img);
        };

        const setVideo = url => {
            wrap.replaceChildren();
            const video = document.createElement("video");
            video.src = url;
            video.controls = true;
            video.playsInline = true;
            wrap.appendChild(video);
            return video;
        };

        if (info.kind === "image") {
            const ready = info.localUrl || fileUrlIfReady(info.fileId);
            if (ready) {
                setImage(ready);
            } else {
                const holder = document.createElement("div");
                holder.className = "chat-placeholder";
                holder.textContent = "در حال بارگذاری تصویر...";
                wrap.appendChild(holder);

                fileBlobUrl(info.fileId).then(setImage).catch(error => {
                    holder.textContent = "تصویر بارگذاری نشد" +
                        (error && error.code ? " (کد " + error.code + ")" : "");
                });
            }
        } else if (info.kind === "video") {
            wrap.classList.add("vid");
            wrap.appendChild(createVideoPlayer({
                fileId: info.fileId, posterId: info.posterId, duration: info.dur,
                size: info.size, localUrl: info.localUrl
            }));
        }
        return wrap;
    }

    function scrollToMessage(id) {
        const line = el.box.querySelector('.chat-row[data-id="' + CSS.escape(id) + '"]');
        if (!line) {
            notify("پیام اصلی در این فهرست نیست.");
            return;
        }
        line.scrollIntoView({ block: "center", behavior: "smooth" });
        line.classList.add("flash");
        setTimeout(() => line.classList.remove("flash"), 1400);
    }

    function render(forceScroll) {
        const rows = currentRows;
        const signature = rows.map(r => r.$id + (r.pending ? "*" : "") + "|" + (r.content || "").length).join(",");
        if (signature === lastSignature && !forceScroll) return;

        const firstRender = lastSignature === null;
        const nearBottom = el.box.scrollHeight - el.box.scrollTop - el.box.clientHeight < 90;
        lastSignature = signature;

        el.box.replaceChildren();

        if (!rows.length) {
            const empty = document.createElement("div");
            empty.className = "chat-empty";
            empty.textContent = canSend
                ? "هنوز پیامی نیست؛ اولین پیام را بفرست."
                : "هنوز اطلاعیه‌ای منتشر نشده است.";
            el.box.appendChild(empty);
            return;
        }

        let lastDay = "";
        let lastSender = "";

        rows.forEach(row => {
            const date = new Date(row.$createdAt);
            const day = date.toLocaleDateString("fa-IR", { year: "numeric", month: "long", day: "numeric" });

            if (day !== lastDay) {
                const separator = document.createElement("div");
                separator.className = "chat-day";
                separator.textContent = day;
                el.box.appendChild(separator);
                lastDay = day;
                lastSender = "";
            }

            const mine = row.owner_id === account.$id;
            const info = parseContent(row);

            const line = document.createElement("div");
            line.className = "chat-row " + (mine ? "mine" : "theirs");
            if (!firstRender && !renderedIds.has(row.$id)) line.classList.add("pop");
            renderedIds.add(row.$id);
            line.dataset.id = row.$id;
            if (row.pending) line.style.opacity = "0.6";

            // در کانال پایگاه آیکون پروفایل کنار پیام‌ها نیست
            if (channelId !== "announcements") {
                line.appendChild(createAvatar(row.owner_id, row.display_name || (mine ? account.name : "")));
            }

            const wrap = document.createElement("div");
            wrap.className = "chat-msg";

            if (channelId === "announcements") {
                // در کانال پایگاه، به‌جای اسم فرستنده، اسم کانال نوشته می‌شود
                const sender = document.createElement("span");
                sender.className = "chat-sender";
                sender.textContent = channelTitle;
                wrap.appendChild(sender);
            } else if (!mine && row.owner_id !== lastSender) {
                const sender = document.createElement("span");
                sender.className = "chat-sender";
                sender.textContent = row.display_name || "عضو";
                wrap.appendChild(sender);
            }
            lastSender = row.owner_id;

            if (info.fw) {
                const fwd = document.createElement("div");
                fwd.className = "chat-fwd";
                fwd.textContent = "↪️ بازارسال‌شده از " + info.fw;
                wrap.appendChild(fwd);
            }

            if (info.reply) {
                const quote = document.createElement("div");
                quote.className = "chat-quote";
                const qn = document.createElement("b");
                qn.textContent = info.reply.n || "پیام";
                const qt = document.createElement("span");
                qt.textContent = info.reply.t || "";
                quote.append(qn, qt);
                quote.addEventListener("click", () => {
                    if (Date.now() - lastLongPress < 700) return;
                    scrollToMessage(info.reply.i);
                });
                wrap.appendChild(quote);
            }

            if (info.kind) wrap.appendChild(buildMedia(info));

            if (info.text) {
                const bubble = document.createElement("p");
                bubble.className = "chat-bubble";
                bubble.dir = "auto";
                bubble.textContent = info.text;
                wrap.appendChild(bubble);
            }

            const meta = document.createElement("div");
            meta.className = "chat-meta";

            const time = document.createElement("span");
            time.textContent = row.pending
                ? "در حال ارسال..."
                : date.toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" });
            meta.appendChild(time);

            if (info.edited) {
                const edited = document.createElement("span");
                edited.className = "chat-edited";
                edited.textContent = "ویرایش‌شده";
                meta.appendChild(edited);
            }

            wrap.appendChild(meta);
            line.appendChild(wrap);
            el.box.appendChild(line);
        });

        if (firstRender || nearBottom || forceScroll) {
            el.box.scrollTop = el.box.scrollHeight;
        }

        refreshProfiles();
        updateDownButton();
    }

    /* ---------- عکس پروفایل کنار پیام‌ها ---------- */

    async function refreshProfiles() {
        const ids = currentRows.map(r => r.owner_id);
        if (channelProfileId) ids.push(channelProfileId);
        await loadProfiles(ids);
        paintAvatars(el.box);
        paintChannelHeader();
    }

    let lastLongPress = 0;

    el.box.addEventListener("click", event => {
        if (Date.now() - lastLongPress < 700) return;
        const avatar = event.target.closest(".avatar");
        if (avatar && avatar.dataset.user === "chan-ann") {
            openChannelCard();
        } else if (avatar) {
            openProfileCard(avatar.dataset.user, avatar.dataset.name, {
                hideDm: !!otherId && avatar.dataset.user === otherId
            });
        }
    });

    /* ---------- دریافت از سرور ---------- */

    let loading = false;

    async function loadMessages() {
        if (loading) return;
        loading = true;

        try {
            const result = await appwriteTablesDB.listRows({
                databaseId: APPWRITE_DATABASE_ID,
                tableId: APPWRITE_MESSAGES_TABLE_ID,
                queries: [
                    Appwrite.Query.equal("group_id", [channelKey]),
                    Appwrite.Query.orderDesc("$createdAt"),
                    Appwrite.Query.limit(100)
                ]
            });

            const cleared = ChatPrefs.clearedAt(channelKey);
            const serverRows = result.rows
                .filter(r => r.record_type === "message" && (!cleared || r.$createdAt > cleared))
                .reverse();
            const serverIds = new Set(serverRows.map(r => r.$id));
            const newest = serverRows.length ? serverRows[serverRows.length - 1].$createdAt : "";

            // پیش‌نمایش محلی عکس‌ها حفظ می‌شود
            const localUrls = new Map(currentRows.filter(r => r.localUrl).map(r => [r.$id, r.localUrl]));
            serverRows.forEach(r => { if (localUrls.has(r.$id)) r.localUrl = localUrls.get(r.$id); });

            // پیام‌های در حال ارسال یا تازه‌تر از آخرین پیام سرور را نگه می‌داریم
            const keep = currentRows.filter(
                r => !serverIds.has(r.$id) && (r.pending || r.$createdAt > newest)
            );

            currentRows = serverRows.concat(keep);
            if (!el.status.textContent.startsWith("گزارش")) el.status.textContent = "";
            render();

            // پیام‌های این گفت‌وگو خوانده شد
            if (!document.hidden && newest) Notifier.markRead(channelKey, newest);
        } catch (error) {
            if (error && error.code === 401) {
                window.location.replace("login.html");
                return;
            }
            console.error("Load messages error:", error);
            notify("خطا در دریافت پیام‌ها؛ اتصال اینترنت را بررسی کن.");
        } finally {
            loading = false;
        }
    }

    /* ---------- دریافت لحظه‌ای (Realtime) ---------- */

    function startRealtime() {
        try {
            const channels = [
                `tablesdb.${APPWRITE_DATABASE_ID}.tables.${APPWRITE_TABLE_ID}.rows`,
                `databases.${APPWRITE_DATABASE_ID}.collections.${APPWRITE_TABLE_ID}.documents`
            ];

            appwriteClient.subscribe(channels, event => {
                // اعلان پیام‌های تازه (این گفت‌وگو و گفت‌وگوهای دیگر)
                try { Notifier.handleRealtime(event, { viewingKey: channelKey }); } catch (_) {}

                const row = event && event.payload;
                if (!row || row.record_type !== "message" || row.group_id !== channelKey) return;

                const deleted = (event.events || []).some(name => /\.delete$/.test(name));

                if (deleted) {
                    currentRows = currentRows.filter(r => r.$id !== row.$id);
                } else {
                    const isNew = !currentRows.some(r => r.$id === row.$id);
                    upsert(row);
                    if (isNew && row.owner_id !== account.$id && downBtn && downBtn.classList.contains("show")) awayNew++;
                }
                render();
            });
        } catch (error) {
            console.warn("Realtime در دسترس نیست؛ فقط بازخوانی دوره‌ای فعال است.", error);
        }
    }

    /* ---------- پروفایل کانال / گروه ---------- */

    function paintChannelHeader() {
        if (!channelProfileId) return;
        el.icon.dataset.user = channelProfileId;
        paintAvatar(el.icon);

        const profile = profileCache.get(channelProfileId) || {};
        if (profile.bio) el.description.textContent = profile.bio;
        if (groupId && profile.name) el.title.textContent = profile.name;
    }

    function chatInfoContext() {
        if (groupId) {
            return { kind: "ugroup", gid: groupId, title: el.title.textContent, onChanged: refreshGroupHeader };
        }
        if (channelId === "announcements") {
            return { kind: "ann", title: channelTitle, canEdit: isAdmin || isManager, onChanged: paintChannelHeader };
        }
        return {
            kind: "ring", ring: channelId, title: channelTitle,
            canEdit: isAdmin || managerRing === channelId, onChanged: paintChannelHeader
        };
    }

    function openChannelCard() {
        if (!channelProfileId) return;
        openChatInfo(chatInfoContext());
    }

    async function refreshGroupHeader() {
        try {
            const team = await appwriteTeams.get({ teamId: groupId });
            profileCache.delete(groupId);
            await loadProfiles([groupId]);
            const p = profileCache.get(groupId) || {};
            el.title.textContent = p.name || team.name;
            document.title = el.title.textContent + " | حلقات صالحین";
            Notifier.setBaseTitle(document.title);
            paintChannelHeader();
        } catch (_) {}
    }

    if (channelProfileId) {
        [el.title, el.icon].forEach(node => {
            node.style.cursor = "pointer";
            node.addEventListener("click", openChannelCard);
        });
    }

    /* ---------- پنجرهٔ عملیات (نگه‌داشتن روی پیام) ---------- */

    function openActions(row) {
        if (row.pending || sheetOpen()) return;

        const info = parseContent(row);
        const mine = row.owner_id === account.$id;
        const inChannel = channelId === "announcements";

        const reply = { icon: "↩️", label: "پاسخ", run: () => startReply(row) };
        const copy = { icon: "📋", label: "کپی کردن پیام", run: () => copyText(info.text) };
        const edit = { icon: "✏️", label: "ویرایش", run: () => startEdit(row) };
        const del = { icon: "🗑️", label: "حذف", danger: true, run: () => deleteMessage(row) };
        const report = { icon: "🚩", label: "گزارش", run: () => chooseReportReason(row) };
        const items = [];

        if (inChannel) {
            // کانال پایگاه: دانلود، بازارسال (با نام/بدون نام)، کپی، گزارش
            // (مدیران فقط پیام‌های خودشان را ویرایش/حذف می‌کنند)
            if (info.kind && info.fileId) {
                items.push({ icon: "⬇️", label: "دانلود", run: () => downloadMedia(info) });
            }
            items.push({ icon: "↪️", label: "بازارسال با نام فرستنده", run: () => openForwardPicker(row, true) });
            items.push({ icon: "📨", label: "بازارسال بدون نام", run: () => openForwardPicker(row, false) });
            if (info.text) items.push(copy);
            if (mine) items.push(edit);
            if (mine) items.push(del);
            if (!mine) items.push(report);
        } else {
            if (canSend) items.push(reply);
            items.push({ icon: "↪️", label: "بازارسال با نام فرستنده", run: () => openForwardPicker(row, true) });
            items.push({ icon: "📨", label: "بازارسال بدون نام", run: () => openForwardPicker(row, false) });
            if (info.text) items.push(copy);
            if (info.kind && (info.fileId || info.localUrl)) {
                items.push({ icon: "⬇️", label: "دانلود", run: () => downloadMedia(info) });
            }
            if (mine) items.push(edit);
            if (mine || canModerate) items.push(del);
            if (!mine) items.push(report);
        }

        showSheet("", items);
    }

    async function downloadMedia(info) {
        try {
            if (info.fileId) await downloadFile(info.fileId, (info.kind === "video" ? "video-" : "photo-") + Date.now());
            else if (info.localUrl) await downloadFromUrl(info.localUrl, "file-" + Date.now());
        } catch (error) {
            notify("دانلود ناموفق بود" + (error && error.message ? ": " + error.message : ""));
        }
    }

    /* ---------- بازارسال ---------- */

    const normalizeQuery = value => String(value || "")
        .replace(/ي/g, "ی").replace(/ك/g, "ک")
        .replace(/[\u200c\s]+/g, " ").trim().toLowerCase();

    async function openForwardPicker(row, withName) {
        const sheet = showSheet(
            withName ? "بازارسال با نام فرستنده به..." : "بازارسال بدون نام فرستنده به...", []);
        sheet.classList.add("fw");

        const search = document.createElement("input");
        search.type = "search";
        search.className = "fw-search";
        search.placeholder = "جستجوی گفت‌وگو یا اکانت...";
        search.autocomplete = "off";

        const list = document.createElement("div");
        list.className = "fw-list";
        sheet.append(search, list);

        const targets = [];
        Object.keys(RING_NAMES)
            .filter(k => isAdmin || labels.includes(k))
            .forEach(k => targets.push({ title: RING_NAMES[k], icon: "👥", payload: { groupId: k } }));
        if (isAdmin || isManager) {
            targets.push({ title: "اطلاع‌رسانی پایگاه", icon: "📢", payload: { groupId: "announcements" } });
        }

        let people = [];
        let query = "";
        let ticket = 0;
        let timer = null;

        function choose(target) {
            closeSheet();
            forwardTo(row, withName, target);
        }

        function draw() {
            list.replaceChildren();
            const q = normalizeQuery(query);

            const shown = targets.filter(t => !q || normalizeQuery(t.title).includes(q));
            const extra = people
                .filter(p => !targets.some(t => t.payload.to === p.id))
                .map(p => ({ title: p.name, icon: "👤", payload: { to: p.id } }));

            [...shown, ...extra].forEach(target => {
                const button = document.createElement("button");
                button.type = "button";
                button.className = "sheet-item";
                const icon = document.createElement("span");
                icon.textContent = target.icon;
                const label = document.createElement("b");
                label.textContent = target.title;
                label.style.fontWeight = "500";
                button.append(icon, label);
                button.addEventListener("click", () => choose(target));
                list.appendChild(button);
            });

            if (!list.children.length) {
                const empty = document.createElement("div");
                empty.className = "sheet-title";
                empty.textContent = "موردی پیدا نشد.";
                list.appendChild(empty);
            }
        }

        draw();

        // گفت‌وگوهای شخصی قبلی
        try {
            const result = await appwriteTablesDB.listRows({
                databaseId: APPWRITE_DATABASE_ID,
                tableId: APPWRITE_TABLE_ID,
                queries: [
                    Appwrite.Query.equal("group_id", [convListKey(account.$id)]),
                    Appwrite.Query.orderDesc("$updatedAt"),
                    Appwrite.Query.limit(50)
                ]
            });
            result.rows.filter(r => r.record_type === "conv").forEach(r => {
                let info = {};
                try { info = JSON.parse(r.content || "{}"); } catch (_) {}
                if (info.w) targets.push({ title: r.display_name || "کاربر", icon: "💬", payload: { to: info.w } });
            });
            draw();
        } catch (_) {}

        search.addEventListener("input", () => {
            query = search.value;
            draw();
            clearTimeout(timer);

            if (query.trim().length < 2) { people = []; draw(); return; }

            timer = setTimeout(async () => {
                const mine = ++ticket;
                try {
                    const data = await callServer({ action: "searchUsers", q: query.trim() });
                    if (mine !== ticket) return;
                    people = data.users || [];
                    draw();
                } catch (_) {}
            }, 300);
        });
    }

    async function forwardTo(row, withName, target) {
        try {
            await callServer({
                action: "forwardMessage",
                messageId: row.$id,
                withName,
                ...target.payload
            });
            notify("به «" + target.title + "» بازارسال شد.", true);
        } catch (error) {
            notify(error.message || "بازارسال ناموفق بود.");
        }
    }

    async function copyText(text) {
        try {
            await navigator.clipboard.writeText(text);
        } catch (_) {
            const area = document.createElement("textarea");
            area.value = text;
            document.body.appendChild(area);
            area.select();
            try { document.execCommand("copy"); } catch (_) {}
            area.remove();
        }
        notify("پیام کپی شد.", true);
    }

    function chooseReportReason(row) {
        showSheet("دلیل گزارش این پیام چیست؟", REPORT_REASONS.map(reason => ({
            icon: "🚩",
            label: reason,
            run: () => sendReport(row, reason)
        })));
    }

    async function sendReport(row, reason) {
        try {
            await callServer({ action: "reportMessage", messageId: row.$id, reason });
            notify("گزارش ثبت شد و برای مدیران ارسال شد.", true);
        } catch (error) {
            notify(error.message || "ثبت گزارش ناموفق بود.");
        }
    }

    async function deleteMessage(row) {
        if (!confirm("این پیام حذف شود؟")) return;

        currentRows = currentRows.filter(r => r.$id !== row.$id);
        render();

        try {
            await callServer({ action: "deleteMessage", messageId: row.$id });
        } catch (error) {
            notify(error.message || "حذف ناموفق بود.");
            await loadMessages();
        }
    }

    /* ---------- پاسخ و ویرایش ---------- */

    let replyTo = null;   // { i, n, t }
    let editingId = null;

    function clearContext() {
        replyTo = null;
        editingId = null;
        el.context.hidden = true;
        el.context.replaceChildren();
    }

    function showContext(label, snippet) {
        el.context.replaceChildren();

        const body = document.createElement("div");
        const b = document.createElement("b");
        b.textContent = label;
        const s = document.createElement("span");
        s.textContent = snippet;
        body.append(b, s);

        const cancel = document.createElement("button");
        cancel.type = "button";
        cancel.textContent = "✕";
        cancel.setAttribute("aria-label", "لغو");
        cancel.addEventListener("click", () => {
            if (editingId) { el.input.value = ""; autosize(); }
            clearContext();
        });

        el.context.append(body, cancel);
        el.context.hidden = false;
    }

    function startReply(row) {
        if (!canSend) { notify("در این کانال امکان پاسخ نداری."); return; }
        const info = parseContent(row);
        const name = row.owner_id === account.$id ? "خودت" : (row.display_name || "عضو");

        editingId = null;
        replyTo = { i: row.$id, n: name, t: snippetOf(info) };
        showContext("پاسخ به " + name, snippetOf(info));
        el.input.focus();
    }

    function startEdit(row) {
        const info = parseContent(row);

        replyTo = null;
        editingId = row.$id;
        clearAttachmentUi();
        el.input.value = info.text;
        autosize();
        showContext("ویرایش پیام", snippetOf(info));
        el.input.focus();
    }

    /* ---------- حرکت‌ها: کشیدن به چپ = پاسخ ، نگه‌داشتن = منو ---------- */

    let gesture = null;

    function rowFromEvent(event) {
        const line = event.target.closest(".chat-row");
        if (!line) return null;
        const row = currentRows.find(r => r.$id === line.dataset.id);
        return row ? { line, row } : null;
    }

    el.box.addEventListener("touchstart", event => {
        if (event.touches.length !== 1) return;
        const hit = rowFromEvent(event);
        if (!hit) return;

        const touch = event.touches[0];
        gesture = { ...hit, x: touch.clientX, y: touch.clientY, dx: 0, mode: "" };
        gesture.timer = setTimeout(() => {
            if (gesture && !gesture.mode) {
                gesture.mode = "long";
                lastLongPress = Date.now();
                if (navigator.vibrate) navigator.vibrate(15);
                openActions(gesture.row);
            }
        }, 450);
    }, { passive: true });

    el.box.addEventListener("touchmove", event => {
        if (!gesture || gesture.mode === "long") return;

        const touch = event.touches[0];
        const dx = touch.clientX - gesture.x;
        const dy = touch.clientY - gesture.y;

        if (!gesture.mode && (Math.abs(dx) > 8 || Math.abs(dy) > 8)) {
            clearTimeout(gesture.timer);
            gesture.mode = (Math.abs(dx) > Math.abs(dy) * 1.4 && dx < 0) ? "swipe" : "scroll";
        }

        if (gesture.mode === "swipe") {
            gesture.dx = dx;
            gesture.line.classList.add("swiping");
            gesture.line.style.transform = "translateX(" + Math.max(dx, -90) + "px)";
            gesture.line.classList.toggle("swipe-ready", dx <= -60);
        }
    }, { passive: true });

    function endGesture(cancelled) {
        if (!gesture) return;
        clearTimeout(gesture.timer);
        const g = gesture;
        gesture = null;

        if (g.mode === "swipe") {
            g.line.classList.remove("swiping", "swipe-ready");
            g.line.style.transform = "";
            if (!cancelled && g.dx <= -60 && !g.row.pending) startReply(g.row);
        }
    }

    el.box.addEventListener("touchend", () => endGesture(false));
    el.box.addEventListener("touchcancel", () => endGesture(true));

    // کامپیوتر: کلیک راست
    el.box.addEventListener("contextmenu", event => {
        const hit = rowFromEvent(event);
        if (hit) {
            event.preventDefault();
            openActions(hit.row);
        }
    });

    /* ---------- پیوست (عکس / ویدیو) ---------- */

    let attached = null; // { file, kind, previewUrl }

    function clearAttachmentUi() {
        attached = null;
        el.file.value = "";
        el.attachment.hidden = true;
        el.attachment.replaceChildren();
    }

    el.attachBtn.addEventListener("click", () => {
        if (editingId) { notify("در حالت ویرایش نمی‌شود فایل پیوست کرد."); return; }
        el.file.click();
    });

    el.file.addEventListener("change", () => {
        const file = el.file.files[0];
        if (!file) return;

        const kind = file.type.startsWith("image/") ? "image"
            : file.type.startsWith("video/") ? "video" : "";

        if (!kind) { notify("فقط عکس و ویدیو قابل ارسال است."); clearAttachmentUi(); return; }
        if (kind === "video" && file.size > MAX_VIDEO) { notify("حجم ویدیو حداکثر ۲۵ مگابایت باشد."); clearAttachmentUi(); return; }
        if (kind === "image" && file.size > MAX_IMAGE) { notify("حجم عکس حداکثر ۱۵ مگابایت باشد."); clearAttachmentUi(); return; }

        el.status.textContent = "";
        attached = { file, kind, previewUrl: URL.createObjectURL(file) };

        el.attachment.replaceChildren();

        if (kind === "image") {
            const img = document.createElement("img");
            img.src = attached.previewUrl;
            el.attachment.appendChild(img);
        } else {
            const icon = document.createElement("div");
            icon.className = "chat-attachment-icon";
            icon.textContent = "🎬";
            el.attachment.appendChild(icon);
        }

        const name = document.createElement("span");
        name.textContent = file.name + " — " + megabytes(file.size);
        el.attachment.appendChild(name);

        const remove = document.createElement("button");
        remove.type = "button";
        remove.textContent = "✕";
        remove.setAttribute("aria-label", "حذف پیوست");
        remove.addEventListener("click", clearAttachmentUi);
        el.attachment.appendChild(remove);

        el.attachment.hidden = false;
        el.input.focus();
    });

    /* ---------- ارسال / ویرایش (فوری و خوش‌بینانه) ---------- */

    function autosize() {
        el.input.style.height = "auto";
        el.input.style.height = Math.min(el.input.scrollHeight, 140) + "px";
    }

    el.input.addEventListener("input", autosize);

    el.input.addEventListener("keydown", event => {
        if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
            event.preventDefault();
            el.form.requestSubmit();
        }
    });

    async function submitEdit() {
        const text = el.input.value.trim();
        const row = currentRows.find(r => r.$id === editingId);

        if (!row) { clearContext(); return; }

        const info = parseContent(row);
        if (!text && !info.fileId && !info.kind) { notify("متن پیام خالی است."); return; }

        const oldContent = row.content;
        row.content = buildContent({ ...info, text, edited: true });

        el.input.value = "";
        autosize();
        const id = editingId;
        clearContext();
        render();

        try {
            await callServer({ action: "editMessage", messageId: id, text });
        } catch (error) {
            row.content = oldContent;
            render();
            notify(error.message || "ویرایش ناموفق بود.");
        }
    }

    el.form.addEventListener("submit", async event => {
        event.preventDefault();

        if (editingId) { await submitEdit(); return; }

        const text = el.input.value.trim();
        const attachment = attached;
        if (!text && !attachment) return;

        const reply = replyTo;
        const tempId = "tmp-" + Date.now() + "-" + Math.random().toString(36).slice(2, 7);

        // پیام همان لحظه نمایش داده می‌شود؛ ارسال واقعی در پس‌زمینه انجام می‌شود
        currentRows.push({
            $id: tempId,
            $createdAt: new Date().toISOString(),
            owner_id: account.$id,
            display_name: account.name,
            content: text,
            pending: true,
            pendingKind: attachment ? attachment.kind : "",
            pendingReply: reply,
            localUrl: attachment ? attachment.previewUrl : ""
        });

        el.input.value = "";
        autosize();
        clearContext();
        attached = null;
        el.attachment.hidden = true;
        el.attachment.replaceChildren();
        el.file.value = "";
        render(true);
        el.input.focus();

        try {
            let fileId = "";

            let posterId = "";
            let duration = 0;

            if (attachment) {
                if (attachment.kind === "video") {
                    // عکس روی جلد و مدت ویدیو (برای پخش‌کنندهٔ زیبا)
                    const meta = await videoMeta(attachment.file);
                    duration = meta.duration;
                    if (meta.poster) { try { posterId = await uploadToBucket(meta.poster); } catch (_) {} }
                }
                const file = attachment.kind === "image"
                    ? await compressImage(attachment.file)
                    : attachment.file;
                fileId = await uploadToBucket(file);
            }

            const payload = { action: "sendMessage", text, fileId };
            if (posterId) { payload.posterId = posterId; payload.dur = duration; }
            if (reply) payload.reply = { id: reply.i };
            if (otherId) payload.to = otherId; else payload.groupId = channelId;

            const data = await callServer(payload);

            const temp = currentRows.find(r => r.$id === tempId);
            if (temp) {
                if (currentRows.some(r => r.$id === data.id)) {
                    // پیام واقعی قبلاً از Realtime رسیده
                    currentRows = currentRows.filter(r => r.$id !== tempId);
                } else {
                    renderedIds.add(data.id);
                    temp.$id = data.id;
                    temp.pending = false;
                    temp.content = buildContent({
                        text, fileId,
                        kind: attachment ? attachment.kind : "",
                        size: attachment ? attachment.file.size : 0,
                        reply, edited: false
                    });
                    delete temp.pendingKind;
                    delete temp.pendingReply;
                }
            }
            render();
        } catch (error) {
            currentRows = currentRows.filter(r => r.$id !== tempId);
            if (!el.input.value) {
                el.input.value = text;
                autosize();
            }
            notify(error.message || "ارسال ناموفق بود.");
            render();
        }
    });

    /* ---------- دکمهٔ رفتن به آخرین پیام ---------- */

    const downBtn = document.getElementById("scrollDown");
    const downBadge = downBtn ? downBtn.querySelector(".chat-down-badge") : null;
    let awayNew = 0;

    function messagesBelow() {
        const bottom = el.box.scrollTop + el.box.clientHeight;
        let count = 0;
        el.box.querySelectorAll(".chat-row").forEach(row => { if (row.offsetTop > bottom) count++; });
        return count;
    }

    function updateDownButton() {
        if (!downBtn) return;
        const far = messagesBelow() > 10;
        downBtn.classList.toggle("show", far);
        if (!far) awayNew = 0;
        if (downBadge) { downBadge.hidden = !awayNew; downBadge.textContent = awayNew.toLocaleString("fa-IR"); }
    }

    if (downBtn) {
        el.box.addEventListener("scroll", updateDownButton, { passive: true });
        downBtn.addEventListener("click", () => {
            awayNew = 0;
            el.box.scrollTo({ top: el.box.scrollHeight, behavior: "smooth" });
        });
    }

    /* ---------- شروع ---------- */

    Notifier.init({ me: account.$id, baseTitle: document.title });
    Notifier.markRead(channelKey);

    const muteBtn = document.getElementById("chatMute");
    if (muteBtn) {
        const paintMute = () => {
            const muted = ChatPrefs.isMuted(channelKey);
            muteBtn.textContent = muted ? "🔕" : "🔔";
            muteBtn.setAttribute("aria-label", muted ? "فعال کردن صدا" : "بی‌صدا کردن");
        };
        paintMute();
        muteBtn.addEventListener("click", () => {
            const next = !ChatPrefs.isMuted(channelKey);
            ChatPrefs.setMuted(channelKey, next);
            paintMute();
            notify(next ? "این گفت‌وگو بی‌صدا شد." : "صدای این گفت‌وگو فعال شد.", true);
        });
    }

    await loadMessages();
    startRealtime();

    setInterval(() => {
        if (!document.hidden) loadMessages();
    }, POLL_MS);

    document.addEventListener("visibilitychange", () => {
        if (!document.hidden) {
            Notifier.markRead(channelKey);
            loadMessages();
        }
    });
})();

</script>

</body>
</html>
