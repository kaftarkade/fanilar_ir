<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#176b45">
    <title>پروفایل من | حلقات صالحین</title>
    <style>

@font-face {
    font-family: "Vazirmatn";
    src: url("./Vazirmatn-Bold.woff2") format("woff2");
    font-weight: 700 900;
    font-style: normal;
    font-display: swap;
}

:root {
    --green: #176b45;
    --green-dark: #104d33;
    --green-light: #e8f4ed;
    --page: #f3f7f4;
    --text: #1c2922;
    --muted: #78857d;
    --border: #e3ebe5;
}

* {
    box-sizing: border-box;
}

html {
    min-height: 100%;
}

body {
    min-height: 100vh;
    margin: 0;
    font-family: "Vazirmatn", Tahoma, sans-serif;
    color: var(--text);
    background: var(--page);
    line-height: 1.9;
}

a {
    color: inherit;
    text-decoration: none;
}

button {
    font: inherit;
}

/* سربرگ */

.messenger-header {
    min-height: 82px;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    background: #fff;
    border-bottom: 1px solid var(--border);
}

.messenger-brand {
    display: flex;
    align-items: center;
    gap: 12px;
}

.brand-icon {
    width: 52px;
    height: 52px;
    display: grid;
    place-items: center;
    flex-shrink: 0;
    border-radius: 17px;
    color: white;
    background: linear-gradient(145deg, #27885b, #125437);
    font-size: 27px;
    font-weight: 900;
}

.brand-copy {
    display: flex;
    flex-direction: column;
}

.brand-copy strong {
    font-size: 15px;
    font-weight: 900;
}

.brand-copy small {
    color: var(--muted);
    font-size: 11px;
}

.account-button {
    padding: 9px 13px;
    border: 1px solid #dce8df;
    border-radius: 13px;
    background: #f8fbf9;
    color: var(--green);
    font-size: 12px;
    font-weight: 800;
    white-space: nowrap;
}

/* صفحه اصلی */

.messenger-main {
    width: min(850px, calc(100% - 24px));
    margin: 22px auto;
    overflow: hidden;
    border: 1px solid var(--border);
    border-radius: 22px;
    background: white;
    box-shadow: 0 8px 28px rgba(22, 73, 47, 0.06);
}

/* سه تب در یک ردیف */

.messenger-tabs {
    display: grid !important;
    grid-template-columns: repeat(3, minmax(0, 1fr)) !important;
    flex-direction: row !important;
    gap: 6px;
    width: 100%;
    padding: 8px;
    background: #f8fbf9;
    border-bottom: 1px solid var(--border);
}

.messenger-tab {
    display: flex !important;
    flex-direction: row !important;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-width: 0;
    min-height: 46px;
    margin: 0;
    padding: 8px 4px;
    border: 1px solid transparent;
    border-radius: 12px;
    background: transparent;
    color: #6f7e73;
    font-size: 13px;
    font-weight: 800;
    white-space: nowrap;
    cursor: pointer;
}

.messenger-tab.active {
    background: var(--green-light);
    color: var(--green);
    border-color: #cfe4d5;
}

.messenger-tab:active {
    transform: scale(0.98);
}

/* محتوای تب‌ها */

.panels-container {
    padding: 24px;
}

.tab-panel {
    margin-bottom: 26px;
}

.tab-panel[hidden] {
    display: none !important;
}

.list-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 16px;
}

.list-heading h1 {
    margin: 0;
    font-size: 19px;
    font-weight: 900;
}

.list-heading p {
    margin: 3px 0 0;
    color: var(--muted);
    font-size: 12px;
}

.section-symbol {
    width: 46px;
    height: 46px;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    border-radius: 15px;
    background: var(--green-light);
    font-size: 22px;
}

.channel-symbol,
.channel-avatar {
    background: #fff2dc;
}

/* کارت گروه و کانال */

.conversation-item {
    display: flex;
    align-items: center;
    gap: 12px;
    min-width: 0;
    padding: 15px;
    border: 1px solid var(--border);
    border-radius: 17px;
    background: #fff;
}

.conversation-item:active {
    background: #f8fbf9;
}

.conversation-avatar {
    width: 54px;
    height: 54px;
    flex: 0 0 54px;
    display: grid;
    place-items: center;
    border-radius: 16px;
    font-size: 21px;
}

.ring-avatar {
    color: #fff;
    background: linear-gradient(145deg, #27885b, #125437);
    font-size: 17px;
    font-weight: 900;
}

.conversation-details {
    flex: 1;
    min-width: 0;
}

.conversation-title {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 7px;
}

.conversation-title h2 {
    margin: 0;
    font-size: 14px;
    font-weight: 900;
}

.member-status {
    padding: 2px 8px;
    border-radius: 20px;
    background: var(--green-light);
    color: var(--green);
    font-size: 10px;
    font-weight: 800;
}

.channel-status {
    background: #fff2dc;
    color: #98611a;
}

.conversation-details p {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 11px;
}

.conversation-arrow {
    flex-shrink: 0;
    color: var(--green);
    font-size: 21px;
}

/* پیام راهنما */

.empty-hint {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    margin-top: 16px;
    padding: 14px;
    border-radius: 14px;
    background: #f5f8f6;
    color: #69796e;
    font-size: 12px;
    line-height: 2.1;
}

.empty-hint p {
    margin: 0;
}

.security-notice {
    margin-top: 0;
    background: #f4f8f5;
}

/* پایین صفحه */

.messenger-footer {
    padding: 18px 12px 25px;
    color: #839087;
    text-align: center;
    font-size: 11px;
}

/* موبایل */

@media (max-width: 520px) {
    .messenger-header {
        min-height: 74px;
        padding: 10px 14px;
        gap: 8px;
    }

    .brand-icon {
        width: 46px;
        height: 46px;
        flex-basis: 46px;
        border-radius: 14px;
        font-size: 24px;
    }

    .brand-copy strong {
        font-size: 13px;
    }

    .brand-copy small {
        font-size: 10px;
    }

    .account-button {
        padding: 8px 9px;
        font-size: 11px;
    }

    .messenger-main {
        margin: 16px auto;
        border-radius: 19px;
    }

    .messenger-tabs {
        gap: 4px;
        padding: 6px;
    }

    .messenger-tab {
        min-height: 44px;
        gap: 4px;
        padding: 7px 2px;
        font-size: 12px;
    }

    .panels-container {
        padding: 18px 14px;
    }

    .list-heading h1 {
        font-size: 17px;
    }

    .list-heading p {
        font-size: 11px;
    }

    .conversation-item {
        gap: 9px;
        padding: 11px 9px;
    }

    .conversation-avatar {
        width: 45px;
        height: 45px;
        flex-basis: 45px;
        font-size: 18px;
    }

    .ring-avatar {
        font-size: 14px;
    }

    .conversation-title h2 {
        font-size: 12px;
    }

    .conversation-details p {
        font-size: 10px;
    }

    .empty-hint {
        padding: 12px;
        font-size: 11px;
    }
}

@media (max-width: 350px) {
    .messenger-tab {
        gap: 3px;
        font-size: 11px;
    }

    .account-button {
        font-size: 10px;
        padding: 7px;
    }
}
</style>
    <style>
/* آواتار دایره‌ای */
.avatar,
.conversation-avatar.has-img {
    background-size: cover;
    background-position: center;
}

.avatar {
    flex: 0 0 auto;
    width: 34px;
    height: 34px;
    border: none;
    padding: 0;
    border-radius: 50%;
    background-color: var(--green-light);
    color: var(--green);
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    display: grid;
    place-items: center;
    cursor: pointer;
    overflow: hidden;
}

.avatar.has-img { color: transparent; }

/* پنجرهٔ پروفایل */
.pc-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: grid;
    place-items: center;
    padding: 16px;
    background: rgba(0, 0, 0, .55);
}

.pc-card {
    position: relative;
    width: 100%;
    max-width: 340px;
    padding: 28px 20px 22px;
    border-radius: 24px;
    background: #fff;
    color: var(--text);
    text-align: center;
    box-shadow: 0 20px 50px rgba(0, 0, 0, .3);
}

.pc-close {
    position: absolute;
    top: 12px;
    inset-inline-start: 12px;
    width: 34px;
    height: 34px;
    border: none;
    border-radius: 50%;
    background: var(--green-light);
    color: var(--green-dark);
    cursor: pointer;
}

.pc-avatar {
    width: 150px;
    height: 150px;
    margin: 0 auto 14px;
    border-radius: 50%;
    background-color: var(--green-light);
    background-size: cover;
    background-position: center;
    color: var(--green);
    font-size: 56px;
    font-weight: 700;
    display: grid;
    place-items: center;
}

.pc-avatar.has-img { color: transparent; }

.pc-card h2 { margin: 0 0 6px; font-size: 20px; }

.pc-bio {
    margin: 0 0 18px;
    font-size: 14px;
    line-height: 1.9;
    color: var(--text);
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.pc-bio.empty { color: var(--muted); }

.pc-dm {
    display: block;
    padding: 12px;
    border-radius: 16px;
    background: var(--green);
    color: #fff;
    font-weight: 700;
    text-decoration: none;
}

/* جستجو در پیام‌های شخصی */
.dm-search { margin: 0 0 12px; }

.dm-search input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 16px;
    font: inherit;
    background: #fff;
    color: var(--text);
    outline: none;
}

.dm-search input:focus { border-color: var(--green); }

.dm-status {
    min-height: 18px;
    margin: 6px 4px 0;
    font-size: 12px;
    color: var(--muted);
}

.dm-section-title {
    margin: 14px 4px 6px;
    font-size: 13px;
    font-weight: 700;
    color: var(--green-dark);
}


/* نمایش بزرگ عکس */
.viewer {
    position: fixed;
    inset: 0;
    z-index: 150;
    display: grid;
    place-items: center;
    background: rgba(0, 0, 0, .92);
}

.viewer img {
    max-width: 100vw;
    max-height: 100vh;
    object-fit: contain;
}

.viewer-bar {
    position: absolute;
    top: 0;
    inset-inline: 0;
    display: flex;
    justify-content: space-between;
    padding: 12px 14px;
    z-index: 1;
}

.viewer-btn {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 50%;
    background: rgba(255, 255, 255, .18);
    color: #fff;
    font-size: 20px;
    cursor: pointer;
}

/* صفحهٔ گزارش‌ها */
.rep-card {
    margin: 0 0 12px;
    padding: 14px;
    border: 1px solid var(--border);
    border-radius: 18px;
    background: #fff;
}

.rep-card header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    font-size: 13px;
    color: var(--muted);
}

.rep-badge {
    padding: 2px 10px;
    border-radius: 999px;
    background: #fee2e2;
    color: #b91c1c;
    font-size: 12px;
    font-weight: 700;
}

.rep-badge.approved { background: #dcfce7; color: #166534; }
.rep-badge.rejected { background: #e5e7eb; color: #374151; }

.rep-msg {
    margin: 8px 0;
    padding: 10px 12px;
    border-radius: 14px;
    background: var(--green-light);
    line-height: 1.9;
    font-size: 14px;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.rep-msg img { display: block; max-width: 100%; max-height: 240px; border-radius: 10px; margin-bottom: 6px; cursor: zoom-in; }

.rep-meta { margin: 4px 0; font-size: 12.5px; color: var(--muted); line-height: 1.9; }

.rep-actions { display: flex; gap: 8px; margin-top: 10px; }

.rep-actions button {
    flex: 1;
    padding: 11px;
    border: none;
    border-radius: 14px;
    font: inherit;
    font-weight: 700;
    cursor: pointer;
}

.rep-actions .approve { background: #dc2626; color: #fff; }
.rep-actions .reject  { background: var(--green-light); color: var(--green-dark); }
.rep-actions button:disabled { opacity: .6; cursor: wait; }


/* عکس کانال/گروه در عنوان صفحه */
.section-symbol.has-img {
    background-size: cover;
    background-position: center;
    color: transparent;
}

.pc-textarea {
    width: 100%;
    margin: 0 0 10px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 14px;
    font: inherit;
    resize: none;
    background: #fff;
    color: var(--text);
}

.pc-action { margin-top: 10px; background: var(--green-dark); border: none; width: 100%; font: inherit; cursor: pointer; }
.pc-secondary { margin-top: 8px; background: var(--green-light); color: var(--green-dark); border: none; width: 100%; font: inherit; cursor: pointer; }
button.pc-dm { width: 100%; border: none; font: inherit; cursor: pointer; }


/* ====== اعلان پیام: بنر، نشان خوانده‌نشده (پررنگ) ====== */
.nb-wrap { position: fixed; top: 10px; inset-inline: 10px; z-index: 200; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }

.nb {
    pointer-events: auto; display: flex; align-items: center; gap: 12px;
    width: 100%; max-width: 560px; margin: 0 auto; padding: 12px 14px;
    border-radius: 20px; border-inline-start: 7px solid #facc15;
    background: linear-gradient(135deg, #0b3d2a, #176b45); color: #fff;
    box-shadow: 0 14px 34px rgba(0, 0, 0, .4); cursor: pointer; animation: nb-in .28s ease-out;
}

.nb-av {
    flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%;
    background: rgba(255, 255, 255, .18); display: grid; place-items: center;
    font-size: 20px; font-weight: 800;
}

.nb-body { flex: 1; min-width: 0; }
.nb-body strong { display: block; font-size: 16px; font-weight: 800; }
.nb-body p { margin: 3px 0 0; font-size: 14px; font-weight: 700; opacity: .95; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.nb-close { border: none; background: rgba(255, 255, 255, .18); color: #fff; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; }

@keyframes nb-in { from { transform: translateY(-120%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

.unread-badge {
    flex: 0 0 auto; min-width: 26px; height: 26px; padding: 0 8px; border-radius: 999px;
    background: #dc2626; color: #fff; font-size: 13px; font-weight: 800;
    display: grid; place-items: center; box-shadow: 0 0 0 4px rgba(220, 38, 38, .22);
    animation: badge-pulse 1.8s ease-in-out infinite;
}
.unread-badge[hidden] { display: none; }

@keyframes badge-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.12); } }

.conversation-item.has-unread { border-color: #dc2626; background: #fff5f5; }
.conversation-item.has-unread h2 { font-weight: 800; }
.conversation-item.has-unread p { font-weight: 800; color: var(--text); }

.nb-permission {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    margin: 0 0 12px; padding: 12px 14px; border-radius: 16px;
    background: #fef3c7; color: #78350f; font-size: 13px; font-weight: 700;
}
.nb-permission button { border: none; border-radius: 12px; padding: 8px 14px; background: #92400e; color: #fff; font: inherit; font-weight: 800; cursor: pointer; }


/* پنجرهٔ عملیات پیام (نگه‌داشتن روی پیام) */
.sheet-overlay {
    position: fixed;
    inset: 0;
    z-index: 130;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: rgba(0, 0, 0, .45);
}

.sheet {
    width: 100%;
    max-width: 460px;
    padding: 10px 8px 16px;
    border-radius: 24px 24px 0 0;
    background: #fff;
    color: var(--text);
}

.sheet-title { margin: 6px 14px 8px; font-size: 13px; color: var(--muted); }

.sheet-item {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 14px 16px;
    border: none;
    border-radius: 14px;
    background: none;
    font: inherit;
    font-size: 15px;
    text-align: start;
    cursor: pointer;
}

.sheet-item:active { background: var(--green-light); }
.sheet-item span { width: 26px; text-align: center; font-size: 20px; }
.sheet-item.danger { color: #dc2626; }


/* ====== صفحهٔ اصلی: فهرست گفتگوها ====== */
.cl-actions { display: flex; gap: 8px; align-items: center; }

.cl-icon-btn {
    width: 42px; height: 42px; border: 1px solid var(--border); border-radius: 50%;
    background: #fff; font-size: 18px; display: grid; place-items: center;
    text-decoration: none; cursor: pointer; color: var(--text);
}

.cl-search { display: flex; gap: 8px; margin: 0 0 10px; }
.cl-search[hidden] { display: none; }
.cl-search input {
    flex: 1; padding: 12px 16px; border: 1px solid var(--green); border-radius: 16px;
    font: inherit; background: #fff; color: var(--text); outline: none;
}
.cl-search button {
    width: 44px; border: none; border-radius: 14px; background: var(--green-light);
    color: var(--green-dark); font-size: 16px; cursor: pointer;
}

.cl-tabs { display: flex; gap: 6px; margin: 0 0 8px; overflow-x: auto; padding-bottom: 2px; }
.cl-tab {
    flex: 1 0 auto; display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 14px; border: 1px solid var(--border); border-radius: 999px;
    background: #fff; color: var(--text); font: inherit; font-weight: 700; cursor: pointer; white-space: nowrap;
}
.cl-tab.active { background: var(--green); border-color: var(--green); color: #fff; }
.cl-count {
    min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px;
    background: #dc2626; color: #fff; font-size: 12px; font-weight: 800;
    display: inline-grid; place-items: center;
}
.cl-count[hidden] { display: none; }

.cl-list { display: flex; flex-direction: column; }
.cl-section { margin: 14px 6px 4px; font-size: 12px; font-weight: 700; color: var(--green-dark); }
.cl-empty { padding: 36px 10px; text-align: center; color: var(--muted); font-size: 14px; }

.cl-item {
    display: flex; align-items: center; gap: 12px; padding: 11px 6px;
    border-bottom: 1px solid var(--border); color: inherit; text-decoration: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
.cl-item:active { background: var(--green-light); }

.cl-avatar {
    flex: 0 0 auto; width: 54px; height: 54px; border-radius: 50%;
    background-color: var(--green-light); background-size: cover; background-position: center;
    color: var(--green); font-size: 22px; font-weight: 800; display: grid; place-items: center;
}
.cl-avatar.has-img { color: transparent; }

.cl-main { flex: 1; min-width: 0; }
.cl-title-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
.cl-kind { font-size: 14px; flex: 0 0 auto; }
.cl-title {
    margin: 0; font-size: 15px; font-weight: 800; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.cl-flag { font-size: 12px; flex: 0 0 auto; opacity: .85; }

.cl-preview {
    margin: 4px 0 0; font-size: 13px; color: var(--muted);
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
}
.cl-item.has-unread .cl-preview { color: var(--text); font-weight: 700; }

.cl-meta { flex: 0 0 auto; min-width: 52px; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
.cl-time { font-size: 12px; color: var(--muted); direction: ltr; }
.cl-item.has-unread .cl-time { color: var(--green); font-weight: 700; }

.cl-badge {
    min-width: 26px; height: 26px; padding: 0 8px; border-radius: 999px;
    background: #dc2626; color: #fff; font-size: 13px; font-weight: 800;
    display: grid; place-items: center;
}
.cl-badge.muted { background: #9ca3af; }


/* ====== پیام کوتاه (Toast) ====== */
.app-toast {
    position: fixed; left: 50%; bottom: 90px; z-index: 300;
    transform: translate(-50%, 30px); opacity: 0; pointer-events: none;
    max-width: 88vw; padding: 12px 18px; border-radius: 16px;
    background: #1f2937; color: #fff; font-size: 14px; font-weight: 700;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
    transition: transform .3s cubic-bezier(.2, .9, .3, 1), opacity .25s ease;
}
.app-toast.good { background: var(--green); }

    <script>
(function () {
    "use strict";

    /* ---------- رنگ تم و حالت تیره (در همهٔ صفحه‌ها) ---------- */

    const THEMES = {
        green:  { g: "#176b45", d: "#104d33", l: "#e8f4ed" },
        blue:   { g: "#2563eb", d: "#1e40af", l: "#e8efff" },
        purple: { g: "#7c3aed", d: "#5b21b6", l: "#f0e9ff" },
        pink:   { g: "#db2777", d: "#9d174d", l: "#fde8f1" },
        orange: { g: "#ea580c", d: "#9a3412", l: "#ffeee3" }
    };

    const root = document.documentElement;

    function applyTheme() {
        let name = "green";
        let dark = false;
        try {
            name = localStorage.getItem("themeColor") || "green";
            dark = localStorage.getItem("darkMode") === "1";
        } catch (_) {}

        const t = THEMES[name] || THEMES.green;
        root.style.setProperty("--green", t.g);
        root.style.setProperty("--green-dark", t.d);
        root.style.setProperty("--green-light", t.l);
        root.classList.toggle("dark", dark);

        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.content = t.g;
    }

    applyTheme();
    window.AppTheme = { THEMES, apply: applyTheme };

    /* ---------- انیمیشن خروج از صفحه ---------- */

    document.addEventListener("click", event => {
        if (event.defaultPrevented || event.button !== 0 || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;

        const link = event.target.closest("a[href]");
        if (!link || link.target === "_blank" || link.hasAttribute("download")) return;

        const href = link.getAttribute("href");
        if (!href || href.startsWith("#") || href.startsWith("javascript:") || /^(mailto|tel):/.test(href)) return;

        const url = new URL(link.href, location.href);
        if (url.origin !== location.origin) return;

        event.preventDefault();
        document.body.classList.add("leaving");
        setTimeout(() => { location.href = url.href; }, 190);
    });

    window.addEventListener("pageshow", () => document.body.classList.remove("leaving"));
})();

</script>

// اجرای تابع سمت سرور؛ هویت کاربر را خود Appwrite تأیید می‌کند
async function callServer(payload) {
    const execution = await appwriteFunctions.createExecution({
        functionId: FUNCTION_ID,
        body: JSON.stringify(payload),
        async: false,
        method: "POST",
        headers: { "content-type": "application/json" }
    });

    let data = {};
    try { data = JSON.parse(execution.responseBody || "{}"); } catch (_) {}

    if (execution.status === "failed" || !data.success) {
        throw new Error(data.error || "درخواست ناموفق بود.");
    }
    return data;
}

// هش کوتاه و ثابت (دقیقاً همان الگوریتم تابع سرور)
function convHash(str) {
    let h1 = 0x811c9dc5, h2 = 5381;
    for (let i = 0; i < str.length; i++) {
        const c = str.charCodeAt(i);
        h1 ^= c; h1 = Math.imul(h1, 16777619) >>> 0;
        h2 = (Math.imul(h2, 33) ^ c) >>> 0;
    }
    return h1.toString(16).padStart(8, "0") + h2.toString(16).padStart(8, "0");
}

// نوع فایل را از روی چند بایت اول حدس می‌زند
function sniffMime(buffer) {
    const b = new Uint8Array(buffer.slice(0, 16));
    const ascii = (from, to) => String.fromCharCode(...b.slice(from, to));
    if (b[0] === 0x89 && ascii(1, 4) === "PNG") return "image/png";
    if (b[0] === 0xff && b[1] === 0xd8) return "image/jpeg";
    if (ascii(0, 3) === "GIF") return "image/gif";
    if (ascii(0, 4) === "RIFF" && ascii(8, 12) === "WEBP") return "image/webp";
    if (ascii(4, 8) === "ftyp") return ascii(8, 12) === "qt  " ? "video/quicktime" : "video/mp4";
    if (b[0] === 0x1a && b[1] === 0x45 && b[2] === 0xdf && b[3] === 0xa3) return "video/webm";
    return "application/octet-stream";
}

// دریافت بایت‌های فایل: اول با خود SDK، بعد با توکن JWT
async function fetchFileBytes(fileId) {
    const url = `${APPWRITE_ENDPOINT}/storage/buckets/${APPWRITE_BUCKET_ID}/files/${fileId}/view`;
    let firstError = null;

    if (typeof appwriteClient.call === "function") {
        try {
            const data = await appwriteClient.call("get", new URL(url), {}, {}, "arrayBuffer");
            if (data && data.byteLength) return data;
        } catch (error) {
            firstError = error;
        }
    }

    const jwt = await getJwt();
    const response = await fetch(url, {
        headers: { "X-Appwrite-Project": APPWRITE_PROJECT_ID, "X-Appwrite-JWT": jwt }
    });

    if (!response.ok) {
        const error = new Error("file " + response.status);
        error.code = response.status || (firstError && firstError.code) || 0;
        throw error;
    }
    return response.arrayBuffer();
}

// دانلود امن فایل و تبدیل به آدرس قابل نمایش
function fileBlobUrl(fileId) {
    if (_blobPromises.has(fileId)) return _blobPromises.get(fileId);

    const promise = (async () => {
        const buffer = await fetchFileBytes(fileId);
        const url = URL.createObjectURL(new Blob([buffer], { type: sniffMime(buffer) }));
        _blobUrls.set(fileId, url);
        return url;
    })();

    _blobPromises.set(fileId, promise);
    promise.catch(error => {
        _blobPromises.delete(fileId);
        console.warn("file load failed", fileId, error && error.code, error && error.message);
    });
    return promise;
}

// کوچک‌کردن عکس قبل از آپلود (سرعت و حجم کمتر)
async function compressImage(file, maxSide = 1280, quality = 0.8) {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return file; // gif و غیره دست‌نخورده
    try {
        const bitmap = await createImageBitmap(file);
        const scale = Math.min(1, maxSide / Math.max(bitmap.width, bitmap.height));
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(bitmap.width * scale);
        canvas.height = Math.round(bitmap.height * scale);
        canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
        const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", quality));
        if (!blob || blob.size >= file.size) return file;
        return new File([blob], "photo.jpg", { type: "image/jpeg" });
    } catch (_) {
        return file;
    }
}

const profileCache = new Map(); // userId -> { name, bio, avatar } یا {}

async function loadProfiles(ids) {
    const missing = [...new Set(ids)].filter(id => id && !profileCache.has(id));

    for (let i = 0; i < missing.length; i += 50) {
        const chunk = missing.slice(i, i + 50);
        try {
            const result = await appwriteTablesDB.listRows({
                databaseId: APPWRITE_DATABASE_ID,
                tableId: APPWRITE_TABLE_ID,
                queries: [Appwrite.Query.equal("$id", chunk), Appwrite.Query.limit(50)]
            });

            const found = new Set();
            result.rows.forEach(row => {
                if (row.record_type !== "profile" && row.record_type !== "group") return;
                let content = {};
                try { content = JSON.parse(row.content || "{}"); } catch (_) {}
                profileCache.set(row.$id, {
                    name: row.display_name || "",
                    bio: content.bio || "",
                    avatar: content.avatar || "",
                    un: content.un || "",
                    ph: content.hp ? "" : (content.ph || ""),
                    hp: !!content.hp
                });
                found.add(row.$id);
            });
            chunk.forEach(id => { if (!found.has(id)) profileCache.set(id, {}); });
        } catch (error) {
            console.warn("loadProfiles failed", error && error.message);
        }
    }
}

function videoMeta(file) {
    return new Promise(resolve => {
        const url = URL.createObjectURL(file);
        const video = document.createElement("video");
        video.preload = "metadata";
        video.muted = true;
        video.playsInline = true;
        video.src = url;

        let duration = 0;
        const finish = (poster) => { clearTimeout(timer); URL.revokeObjectURL(url); resolve({ poster, duration }); };
        const timer = setTimeout(() => finish(null), 9000);

        video.onerror = () => finish(null);
        video.onloadedmetadata = () => {
            duration = isFinite(video.duration) ? video.duration : 0;
            try { video.currentTime = Math.min(1, (duration || 1) / 2); } catch (_) { finish(null); }
        };
        video.onseeked = () => {
            try {
                const scale = Math.min(1, 480 / (video.videoWidth || 480));
                const canvas = document.createElement("canvas");
                canvas.width = Math.max(1, Math.round((video.videoWidth || 480) * scale));
                canvas.height = Math.max(1, Math.round((video.videoHeight || 270) * scale));
                canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
                canvas.toBlob(blob => finish(blob ? new File([blob], "poster.jpg", { type: "image/jpeg" }) : null),
                    "image/jpeg", 0.7);
            } catch (_) { finish(null); }
        };
    });
}

function fmtTime(seconds) {
    seconds = Math.max(0, Math.round(seconds || 0));
    const m = Math.floor(seconds / 60), s = seconds % 60;
    return m.toLocaleString("fa-IR") + ":" + String(s).padStart(2, "0").replace(/\d/g, d => "۰۱۲۳۴۵۶۷۸۹"[d]);
}

        membersBox.replaceChildren(ui("div", "pc-members-title", "اعضا (" + list.length.toLocaleString("fa-IR") + ")"));

        list.forEach(member => {
            const row = ui("div", "pc-member");
            const av = createAvatar(member.id, member.name);
            const info = ui("div", "pc-member-info");
            info.appendChild(ui("b", "", member.name || "عضو"));
            if (member.un) info.appendChild(ui("small", "", "@" + member.un));
            row.append(av, info);

            const role = { owner: "سازنده", manager: "مدیر" }[member.role];
            if (role) row.appendChild(ui("span", "pc-role", role));

            if (options.canRemove && member.id !== selfId && member.role !== "owner") {
                const rm = ui("button", "pc-remove", "✕");
                rm.type = "button";
                rm.setAttribute("aria-label", "حذف عضو");
                rm.addEventListener("click", async event => {
                    event.stopPropagation();
                    if (!confirm("«" + member.name + "» از گروه حذف شود؟")) return;
                    try { await options.onRemove(member.id); row.remove(); appToast("عضو حذف شد.", true); }
                    catch (error) { appToast(error.message || "حذف ناموفق بود."); }
                });
                row.appendChild(rm);
            }

            row.addEventListener("click", () => { remove(); openProfileCard(member.id, member.name, {}); });
            membersBox.appendChild(row);
        });

        await loadProfiles(list.map(x => x.id));
        paintAvatars(membersBox);
    }

    if (options.members) showMembers(options.members);
    else if (options.membersLoader) options.membersLoader().then(showMembers).catch(() => {});

    await loadProfiles([userId]);
    const profile = profileCache.get(userId) || {};

    nameEl.textContent = profile.name || nameHint || "کاربر";
    bioEl.textContent = profile.bio || (options.noBioText || "بیوگرافی ثبت نشده است.");
    bioEl.classList.toggle("empty", !profile.bio);

    if (profile.un) {
        idEl.hidden = false;
        idEl.textContent = "@" + profile.un;
        idEl.addEventListener("click", () => {
            try { navigator.clipboard.writeText("@" + profile.un); appToast("آیدی کپی شد.", true); } catch (_) {}
        });
    }
    if (profile.ph) {
        phoneEl.hidden = false;
        phoneEl.textContent = "📱 " + profile.ph;
    }

    paintAvatar(big);

    if (profile.avatar) {
        big.style.cursor = "zoom-in";
        big.addEventListener("click", async () => {
            try { openImageViewer(await fileBlobUrl(profile.avatar), "profile-" + (profile.name || "user"), profile.avatar); }
            catch (_) {}
        });
    }
}

/* ---------- ویرایش پروفایل کانال/گروه حلقه ---------- */

function pickImageInto(preview, letterText) {
    const state = { file: null, remove: false };
    const input = ui("input"); input.type = "file"; input.accept = "image/*"; input.hidden = true;

    preview.style.cursor = "pointer";
    preview.addEventListener("click", () => input.click());
    input.addEventListener("change", () => {
        const f = input.files[0];
        if (!f || !f.type.startsWith("image/")) return;
        state.file = f; state.remove = false;
        preview.textContent = "";
        preview.classList.add("has-img");
        preview.style.backgroundImage = 'url("' + URL.createObjectURL(f) + '")';
    });
    state.clear = () => {
        state.file = null; state.remove = true;
        preview.classList.remove("has-img");
        preview.style.backgroundImage = "";
        preview.textContent = letterText;
    };
    state.input = input;
    return state;
}

function openChannelEditor(ctx) {
    const profile = profileCache.get(ctx.profileId) || {};
    const overlay = ui("div", "pc-overlay");
    const card = ui("div", "pc-card");

    const preview = ui("div", "pc-avatar", (ctx.title || "?").trim().charAt(0));
    if (profile.avatar) { preview.dataset.user = ctx.profileId; paintAvatar(preview); }
    const pick = pickImageInto(preview, (ctx.title || "?").trim().charAt(0));

    const bio = ui("textarea", "pc-textarea");
    bio.maxLength = 150; bio.rows = 3; bio.placeholder = "بیوگرافی (حداکثر ۱۵۰ کاراکتر)"; bio.value = profile.bio || "";

    const message = ui("p", "pc-bio empty");
    const save = ui("button", "pc-dm", "ذخیره"); save.type = "button";
    const rm = ui("button", "pc-dm pc-secondary", "حذف عکس"); rm.type = "button";
    const cancel = ui("button", "pc-dm pc-secondary", "انصراف"); cancel.type = "button";

    rm.addEventListener("click", () => pick.clear());
    cancel.addEventListener("click", () => closeOverlay(overlay));

    save.addEventListener("click", async () => {
        save.disabled = true;
        message.textContent = "در حال ذخیره...";
        try {
            const payload = { action: "updateChannelProfile", channel: ctx.channelId, bio: bio.value };
            if (pick.file) payload.avatarFileId = await uploadToBucket(await compressImage(pick.file, 512, 0.85));
            else if (pick.remove) payload.removeAvatar = true;

            await callServer(payload);
            profileCache.delete(ctx.profileId);
            await loadProfiles([ctx.profileId]);
            closeOverlay(overlay);
            appToast("پروفایل ذخیره شد.", true);
            if (ctx.onChanged) ctx.onChanged();
        } catch (error) {
            message.textContent = error.message || "ذخیره ناموفق بود.";
            save.disabled = false;
        }
    });

    card.append(ui("h2", "", "ویرایش " + ctx.title), preview, ui("p", "pc-bio empty", "برای تغییر عکس، روی دایره بزن."),
        pick.input, bio, message, save, rm, cancel);
    overlay.appendChild(card);
    overlay.addEventListener("click", event => { if (event.target === overlay) closeOverlay(overlay); });
    document.body.appendChild(overlay);
}

/* ---------- ساخت و ویرایش گروه کاربران ---------- */

function userPicker(excludeIds, onChange) {
    const wrap = ui("div", "gp-picker");
    const chips = ui("div", "gp-chips");
    const search = ui("input", "pc-textarea gp-search");
    search.type = "search"; search.placeholder = "جستجوی اسم یا آیدی (@)..."; search.autocomplete = "off";
    const results = ui("div", "gp-results");
    wrap.append(chips, search, results);

    const selected = new Map();
    let ticket = 0, timer = null;

    function drawChips() {
        chips.replaceChildren();
        selected.forEach((name, id) => {
            const chip = ui("button", "gp-chip", name + " ✕");
            chip.type = "button";
            chip.addEventListener("click", () => { selected.delete(id); drawChips(); if (onChange) onChange(); });
            chips.appendChild(chip);
        });
    }

    search.addEventListener("input", () => {
        clearTimeout(timer);
        const q = search.value.trim();
        if (q.replace(/^@/, "").length < 2) { results.replaceChildren(); return; }

        timer = setTimeout(async () => {
            const mine = ++ticket;
            try {
                const data = await callServer({ action: "searchUsers", q });
                if (mine !== ticket) return;
                results.replaceChildren();
                (data.users || []).filter(u => !excludeIds.includes(u.id)).forEach(user => {
                    const row = ui("button", "gp-result");
                    row.type = "button";
                    row.append(ui("b", "", user.name), ui("small", "", user.un ? "@" + user.un : ""));
                    row.addEventListener("click", () => {
                        selected.set(user.id, user.name);
                        drawChips();
                        search.value = "";
                        results.replaceChildren();
                        if (onChange) onChange();
                    });
                    results.appendChild(row);
                });
            } catch (_) {}
        }, 300);
    });

    return { node: wrap, selected };
}

function openGroupEditor(ctx) {
    // ctx: { mode: "create" | "edit", gid, current:{name,bio}, onDone(gid) }
    const editing = ctx.mode === "edit";
    const current = ctx.current || {};
    const profile = editing ? (profileCache.get(ctx.gid) || {}) : {};

    const overlay = ui("div", "pc-overlay");
    const card = ui("div", "pc-card gp-card");

    const preview = ui("div", "pc-avatar", (current.name || "گ").trim().charAt(0));
    if (editing && profile.avatar) { preview.dataset.user = ctx.gid; paintAvatar(preview); }

    const name = ui("input", "pc-textarea"); name.type = "text"; name.maxLength = 40; name.placeholder = "اسم گروه"; name.value = current.name || "";
    const bio = ui("textarea", "pc-textarea"); bio.maxLength = 150; bio.rows = 2; bio.placeholder = "توضیحات گروه (اختیاری)"; bio.value = profile.bio || current.bio || "";

    const picker = editing ? null : userPicker([]);
    const message = ui("p", "pc-bio empty");
    const save = ui("button", "pc-dm", editing ? "ذخیره" : "ساخت گروه"); save.type = "button";
    const cancel = ui("button", "pc-dm pc-secondary", "انصراف"); cancel.type = "button";
    cancel.addEventListener("click", () => closeOverlay(overlay));

    save.addEventListener("click", async () => {
        const title = name.value.trim();
        if (title.length < 2) { message.textContent = "اسم گروه حداقل ۲ حرف باشد."; return; }

        save.disabled = true;
        message.textContent = editing ? "در حال ذخیره..." : "در حال ساخت گروه...";
        try {
            const payload = editing
                ? { action: "updateGroup", id: ctx.gid, name: title, bio: bio.value }
                : { action: "createGroup", name: title, bio: bio.value, memberIds: [...picker.selected.keys()] };

            if (pick.file) payload.avatarFileId = await uploadToBucket(await compressImage(pick.file, 512, 0.85));

            if (ctx.onDone) ctx.onDone(gid);
        } catch (error) {
            message.textContent = error.message || "انجام نشد.";
            save.disabled = false;
        }
    });

    card.append(ui("h2", "", editing ? "ویرایش گروه" : "گروه جدید"), preview,
        ui("p", "pc-bio empty", "برای انتخاب عکس گروه، روی دایره بزن."), pick.input, name, bio);
    if (picker) card.append(ui("div", "pc-members-title", "افزودن عضو"), picker.node);
    card.append(message, save, cancel);

    overlay.appendChild(card);
    overlay.addEventListener("click", event => { if (event.target === overlay) closeOverlay(overlay); });
    document.body.appendChild(overlay);
}

function openAddMembers(ctx) {
    const overlay = ui("div", "pc-overlay");
    const card = ui("div", "pc-card gp-card");
    const picker = userPicker(ctx.existingIds || []);
    const message = ui("p", "pc-bio empty");

            await callServer({ action: "addGroupMembers", id: ctx.gid, userIds: ids });

            appToast("عضوها اضافه شدند.", true);

}

/* ---------- اطلاعات گفت‌وگو (دایره‌ی پروفایل / عنوان) ---------- */

async function openChatInfo(ctx) {
    const me = await myId();

    if (ctx.kind === "dm") return openProfileCard(ctx.userId, ctx.title, { hideDm: true });

    if (ctx.kind === "ann") {
        return openProfileCard("chan-ann", ctx.title, {
            hideDm: true, noBioText: "توضیحاتی ثبت نشده است.",
            actionLabel: ctx.canEdit ? "✏️ ویرایش عکس و بیوگرافی" : "",
            onAction: () => openChannelEditor({ profileId: "chan-ann", channelId: "announcements", title: ctx.title, onChanged: ctx.onChanged })
        });
    }

    if (ctx.kind === "ring") {
        return openProfileCard("chan-" + ctx.ring, ctx.title, {
            hideDm: true, noBioText: "توضیحاتی ثبت نشده است.",
            membersLoader: () => callServer({ action: "groupInfo", ring: ctx.ring }).then(d => d.members),
            actionLabel: ctx.canEdit ? "✏️ ویرایش عکس و بیوگرافی" : "",
            onAction: () => openChannelEditor({ profileId: "chan-" + ctx.ring, channelId: ctx.ring, title: ctx.title, onChanged: ctx.onChanged })
        });
    }

    if (ctx.kind === "ugroup") {
        let info;
        try { info = await callServer({ action: "groupInfo", id: ctx.gid }); }
        catch (error) { appToast(error.message || "اطلاعات گروه دریافت نشد."); return; }

        const owner = info.owner === me;
        const buttons = owner ? [
            { label: "✏️ ویرایش گروه", run: () => openGroupEditor({ mode: "edit", gid: ctx.gid, current: { name: ctx.title }, onDone: () => ctx.onChanged && ctx.onChanged() }) },
            { label: "➕ افزودن عضو", run: () => openAddMembers({ gid: ctx.gid, existingIds: info.members.map(x => x.id), onDone: () => ctx.onChanged && ctx.onChanged() }) },
            { label: "🗑️ حذف گروه", danger: true, run: async () => {
                if (!confirm("گروه و همهٔ پیام‌هایش برای همیشه حذف می‌شود. ادامه می‌دهی؟")) return;
                try { await callServer({ action: "deleteGroup", id: ctx.gid }); location.href = "index.html"; }
                catch (error) { appToast(error.message || "حذف ناموفق بود."); }
            } }
        ] : [
            { label: "🚪 ترک گروه", danger: true, run: async () => {
                if (!confirm("از این گروه خارج می‌شوی. ادامه می‌دهی؟")) return;
                try { await callServer({ action: "removeGroupMember", id: ctx.gid, userId: me }); location.href = "index.html"; }
                catch (error) { appToast(error.message || "خروج ناموفق بود."); }
            } }
        ];

        return openProfileCard(ctx.gid, ctx.title, {
            hideDm: true, noBioText: "توضیحاتی ثبت نشده است.",
            members: info.members, canRemove: owner, buttons,
            onRemove: uid => callServer({ action: "removeGroupMember", id: ctx.gid, userId: uid })
        });
    }
}

/* ---------- انتشار پروفایل خود کاربر (برای صفحهٔ پروفایل) ---------- */

async function publishPublicProfile(patch) {
    try {
        const payload = { action: "updateProfile" };

        if ("bio" in patch) payload.bio = patch.bio || "";

        if ("avatarDataUrl" in patch) {
            if (!patch.avatarDataUrl) {
                payload.removeAvatar = true;
            } else {
                const blob = await (await fetch(patch.avatarDataUrl)).blob();
                const file = new File([blob], "avatar.jpg", { type: blob.type || "image/jpeg" });
                payload.avatarFileId = await uploadToBucket(file);
            }
        }

        await callServer(payload);
        profileCache.delete(await myId());
        return true;
    } catch (error) {
        publishPublicProfile.lastError = (error && error.message) || "خطای نامشخص";
        console.warn("publishPublicProfile failed:", error && error.message);
        return false;
    }
}

// اگر عکس/بیوگرافی قبلاً فقط در prefs بوده، یک بار برای بقیه منتشر می‌شود
async function ensurePublicProfileSynced(prefs) {
    try {
        const key = ((prefs && prefs.avatar) || "").length + ":" + ((prefs && prefs.bio) || "");
        if (localStorage.getItem("pubProfileKey") === key) return;

        const patch = { bio: (prefs && prefs.bio) || "" };
        if (prefs && prefs.avatar) patch.avatarDataUrl = prefs.avatar;

        if (await publishPublicProfile(patch)) localStorage.setItem("pubProfileKey", key);
    } catch (_) {}
}


/* ---------- پنجرهٔ عملیات (منوی پایین صفحه) ---------- */

let _activeSheet = null;

function closeOverlay(node) {
    if (!node || node.classList.contains("closing")) return;
    node.classList.add("closing");
    setTimeout(() => node.remove(), 200);
}

function closeSheet() {
    if (_activeSheet) { const node = _activeSheet; _activeSheet = null; closeOverlay(node); }
}

function sheetOpen() { return !!_activeSheet; }

function showSheet(titleText, items) {
    closeSheet();

    const overlay = document.createElement("div");
    overlay.className = "sheet-overlay";

    const sheet = document.createElement("div");
    sheet.className = "sheet";

    if (titleText) {
        const title = document.createElement("div");
        title.className = "sheet-title";
        title.textContent = titleText;
        sheet.appendChild(title);
    }

    items.forEach(item => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "sheet-item" + (item.danger ? " danger" : "");

        const icon = document.createElement("span");
        icon.textContent = item.icon;
        const label = document.createElement("b");
        label.textContent = item.label;
        label.style.fontWeight = "500";

        button.append(icon, label);
        button.addEventListener("click", () => { closeSheet(); item.run(); });
        sheet.appendChild(button);
    });

    overlay.appendChild(sheet);
    overlay.addEventListener("click", event => { if (event.target === overlay) closeSheet(); });
    document.body.appendChild(overlay);
    _activeSheet = overlay;
    return sheet;
}

</script>
<script>
"use strict";

/* =========================================================
   اعلان پیام: شمارندهٔ خوانده‌نشده، صدا، لرزش، بنر، عنوان صفحه
========================================================= */

/* ---------- تنظیمات هر گفت‌وگو: سنجاق، بی‌صدا، پاک‌شده ---------- */

const ChatPrefs = (() => {
    const NAME = "chatPrefs";
    const load = () => { try { return JSON.parse(localStorage.getItem(NAME) || "{}"); } catch (_) { return {}; } };
    const save = value => { try { localStorage.setItem(NAME, JSON.stringify(value)); } catch (_) {} };
    const get = (kind, key) => (load()[kind] || {})[key];

    function set(kind, key, value) {
        const all = load();
        all[kind] = all[kind] || {};
        if (value === undefined || value === null || value === false) delete all[kind][key];
        else all[kind][key] = value;
        save(all);
    }

    return {
        isMuted: key => !!get("muted", key),
        setMuted: (key, on) => {
            set("muted", key, on ? 1 : false);
            if (typeof window.__muteChanged === "function") window.__muteChanged();
        },
        mutedKeys: () => Object.keys(load().muted || {}),
        pinnedAt: key => get("pinned", key) || 0,
        pinRaw: key => get("pinned", key),
        unpin: key => set("pinned", key, -1),
        setPinned: (key, on) => set("pinned", key, on ? Date.now() : false),
        clearedAt: key => get("cleared", key) || "",
        setCleared: (key, iso) => set("cleared", key, iso || new Date().toISOString())
    };
})();

/* ---------- تنظیمات برنامه (صدا، لرزش، بنر، بی‌صدای کلی) ---------- */

const AppSettings = {
    get(key, fallback) {
        try {
            const all = JSON.parse(localStorage.getItem("appSettings") || "{}");
            return key in all ? all[key] : fallback;
        } catch (_) { return fallback; }
    },
    set(key, value) {
        let all = {};
        try { all = JSON.parse(localStorage.getItem("appSettings") || "{}"); } catch (_) {}
        all[key] = value;
        try { localStorage.setItem("appSettings", JSON.stringify(all)); } catch (_) {}
    }
};

const Notifier = (() => {
    const UNREAD_KEY = "unreadCounts";
    const READ_KEY = "lastReadTimes";

    let me = null;
    let baseTitle = document.title;
    let flashTimer = null;

    const load = name => { try { return JSON.parse(localStorage.getItem(name) || "{}"); } catch (_) { return {}; } };
    const save = (name, value) => { try { localStorage.setItem(name, JSON.stringify(value)); } catch (_) {} };

    /* ---------- شمارنده‌ها ---------- */

    const getUnread = key => load(UNREAD_KEY)[key] || 0;
    const getLastRead = key => load(READ_KEY)[key] || "";
    const totalUnread = () => Object.values(load(UNREAD_KEY)).reduce((a, b) => a + b, 0);

    function refreshTitle() {
        const n = totalUnread();
        if (!flashTimer) document.title = (n ? "(" + n + ") " : "") + baseTitle;
    }

    function setUnread(key, count) {
        const map = load(UNREAD_KEY);
        if (count > 0) map[key] = count; else delete map[key];
        save(UNREAD_KEY, map);
        refreshTitle();
    }

    function markRead(key, iso) {
        const map = load(READ_KEY);
        const time = iso || new Date().toISOString();
        if (!map[key] || time > map[key]) map[key] = time;
        save(READ_KEY, map);
        setUnread(key, 0);
    }

    if ("serviceWorker" in navigator) {
        navigator.serviceWorker.addEventListener("message", event => {
            if (event.data && event.data.type === "read" && event.data.key) markRead(event.data.key);
        });
    }

    function init(options) {
        me = options.me;
        enablePush();
        baseTitle = options.baseTitle || document.title;
        refreshTitle();
        applyReadQueue();
        enablePush();
    }

    function setBaseTitle(title) { baseTitle = title; refreshTitle(); }

    /* ---------- صدا و لرزش ---------- */

    let audio = null;

    function unlock() {
        try {
            if (!audio) {
                const AC = window.AudioContext || window.webkitAudioContext;
                if (AC) audio = new AC();
            }
            if (audio && audio.state === "suspended") audio.resume();
        } catch (_) {}
    }
    ["pointerdown", "keydown", "touchstart"].forEach(name =>
        window.addEventListener(name, unlock, { passive: true }));

    function ping(strong) {
        if (!AppSettings.get("sound", true) || AppSettings.get("muteAll", false)) return;
        if (!audio || audio.state !== "running") return;
        const t0 = audio.currentTime;
        const tones = strong ? [880, 1175, 1568] : [988];

        tones.forEach((freq, i) => {
            const osc = audio.createOscillator();
            const gain = audio.createGain();
            const start = t0 + i * 0.13;

            osc.type = "sine";
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.0001, start);
            gain.gain.exponentialRampToValueAtTime(strong ? 0.4 : 0.12, start + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.28);

            osc.connect(gain);
            gain.connect(audio.destination);
            osc.start(start);
            osc.stop(start + 0.32);
        });
    }

    function buzz(strong) {
        if (!AppSettings.get("vibrate", true) || AppSettings.get("muteAll", false)) return;
        try { if (navigator.vibrate) navigator.vibrate(strong ? [140, 70, 140] : 30); } catch (_) {}
    }

    /* ---------- چشمک‌زدن عنوان صفحه ---------- */

    function startFlash() {
        if (flashTimer || !document.hidden) return;
        let on = false;
        flashTimer = setInterval(() => {
            on = !on;
            document.title = on ? "🔔 پیام جدید!" : baseTitle;
        }, 1000);
    }

    function stopFlash() {
        if (flashTimer) { clearInterval(flashTimer); flashTimer = null; }
        refreshTitle();
    }

    document.addEventListener("visibilitychange", () => { if (!document.hidden) stopFlash(); });

    /* ---------- بنر درون‌برنامه‌ای (پررنگ و بزرگ) ---------- */

    function banner({ title, text, href, letter }) {
        if (!AppSettings.get("banner", true)) return;
        if (!AppSettings.get("banner", true) || AppSettings.get("muteAll", false)) return;
        let wrap = document.getElementById("nbWrap");
        if (!wrap) {
            wrap = document.createElement("div");
            wrap.id = "nbWrap";
            wrap.className = "nb-wrap";
            document.body.appendChild(wrap);
        }
        while (wrap.children.length >= 3) wrap.firstChild.remove();

        const card = document.createElement("div");
        card.className = "nb";
        card.setAttribute("role", "alert");

        const av = document.createElement("div");
        av.className = "nb-av";
        av.textContent = letter || "💬";

        const body = document.createElement("div");
        body.className = "nb-body";
        const strong = document.createElement("strong");
        strong.textContent = title;
        const p = document.createElement("p");
        p.textContent = text;
        body.append(strong, p);

        const close = document.createElement("button");
        close.type = "button";
        close.className = "nb-close";
        close.textContent = "✕";
        close.setAttribute("aria-label", "بستن");

        card.append(av, body, close);
        wrap.appendChild(card);

        const remove = () => { card.classList.add("leaving"); setTimeout(() => card.remove(), 220); };
        close.addEventListener("click", event => { event.stopPropagation(); remove(); });
        card.addEventListener("click", () => { if (href) window.location.href = href; });
        setTimeout(remove, 7000);
    }

    /* ---------- اعلان سیستم (وقتی صفحه در پس‌زمینه است) ---------- */

    function systemNotify(title, body, href, tag) {
        if (!("Notification" in window) || Notification.permission !== "granted") return;
        try {
            const n = new Notification(title, { body, tag, renotify: true });
            n.onclick = () => { window.focus(); if (href) window.location.href = href; n.close(); };
        } catch (_) { /* برخی مرورگرهای موبایل اجازهٔ ساخت مستقیم را نمی‌دهند */ }
    }

    function permissionBar(before) {
        if (!("Notification" in window) || Notification.permission !== "default") return;

        const bar = document.createElement("div");
        bar.className = "nb-permission";

        const text = document.createElement("span");
        text.textContent = "🔔 برای دریافت اعلان پیام‌ها، اعلان را فعال کن.";

        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "فعال‌سازی";
        button.addEventListener("click", async () => {
            unlock();
            try { await Notification.requestPermission(); } catch (_) {}
            bar.remove();
            enablePush();
            enablePush();
        });

        bar.append(text, button);
        before.parentNode.insertBefore(bar, before);
    }

    /* ---------- اعلان گوشی (Web Push) ---------- */

    const b64ToBytes = b64 => {
        const pad = "=".repeat((4 - (b64.length % 4)) % 4);
        const raw = atob((b64 + pad).replace(/-/g, "+").replace(/_/g, "/"));
        return Uint8Array.from(raw, c => c.charCodeAt(0));
    };

    const pushSupported = () =>
        "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

    async function enablePush() {
        if (!pushSupported() || Notification.permission !== "granted") return false;
        try {
            const reg = await navigator.serviceWorker.register("sw.js");
            await navigator.serviceWorker.ready;

            let sub = await reg.pushManager.getSubscription();
            if (sub && localStorage.getItem("vapidUsed") !== VAPID_PUBLIC_KEY) {
                await sub.unsubscribe();
                sub = null;
            }
            if (!sub) {
                sub = await reg.pushManager.subscribe({
                    userVisibleOnly: true,
                    applicationServerKey: b64ToBytes(VAPID_PUBLIC_KEY)
                });
            }
            localStorage.setItem("vapidUsed", VAPID_PUBLIC_KEY);

            await callServer({ action: "savePush", subscription: sub.toJSON(), muted: ChatPrefs.mutedKeys() });
            return true;
        } catch (error) {
            console.warn("enablePush failed:", error && error.message);
            return false;
        }
    }

    let muteTimer = null;
    window.__muteChanged = () => {
        clearTimeout(muteTimer);
        muteTimer = setTimeout(() => { enablePush(); }, 1500);
    };

    // «درج به‌عنوان خوانده‌شده» از روی اعلان گوشی
    function applyReadQueue() {
        try {
            const open = indexedDB.open("fani", 1);
            open.onupgradeneeded = () => open.result.createObjectStore("read", { keyPath: "key" });
            open.onsuccess = () => {
                const db = open.result;
                const tx = db.transaction("read", "readwrite");
                const store = tx.objectStore("read");
                const all = store.getAll();
                all.onsuccess = () => {
                    (all.result || []).forEach(item => { markRead(item.key); store.delete(item.key); });
                };
            };
        } catch (_) {}
    }

    /* ---------- پیام‌های ورودی ---------- */

    function previewOf(row) {
        const raw = String(row.content || "");
        if (raw.startsWith('{"_m":1')) {
            try {
                const o = JSON.parse(raw);
                if (o.t) return String(o.t).slice(0, 90);
                return o.k === "video" ? "🎬 ویدیو" : "📷 تصویر";
            } catch (_) {}
        }
        return raw.slice(0, 90);
    }

    function routeOf(row) {
        const key = String(row.group_id || "");
        if (key === "m:ann") {
            return { href: "chat.html?type=announcements", title: "📢 اطلاع‌رسانی پایگاه", letter: "📢" };
        }
        if (key.startsWith("m:ring")) {
            const ring = key.slice(2);
            return { href: "chat.html?type=ring&group=" + ring, title: "👥 " + (RING_NAMES[ring] || "گروه"), letter: "👥" };
        }
        if (key.startsWith("d:")) {
            const name = row.display_name || "پیام شخصی";
            return {
                href: "chat.html?type=dm&user=" + encodeURIComponent(row.owner_id),
                title: "💬 " + name,
                letter: name.trim().charAt(0) || "💬"
            };
        }
        return null;
    }

    /**
     * هر رویداد Realtime جدول را بده؛ اگر پیام تازه از دیگران باشد اعلان می‌دهد.
     * viewingKey: گفت‌وگویی که کاربر همین الان در آن است (یا null)
     */
    function handleRealtime(event, options) {
        options = options || {};
        const row = event && event.payload;

        // گزارش جدید (فقط مدیرهای مربوط این رویداد را می‌گیرند)
        if (row && row.record_type === "report" && me && (event.events || []).some(name => /\.create$/.test(name))) {
            let c = {};
            try { c = JSON.parse(row.content || "{}"); } catch (_) {}
            const text = c.tx ? String(c.tx).slice(0, 90) : (c.k === "video" ? "🎬 ویدیو" : "📷 تصویر");

            setUnread("tool:reports", getUnread("tool:reports") + 1);
            if (!ChatPrefs.isMuted("tool:reports")) {
                ping(true);
                buzz(true);
                if (!document.hidden) banner({ title: "🛡️ گزارش جدید", text, href: "reports.html", letter: "🛡️" });
                else { startFlash(); systemNotify("🛡️ گزارش جدید", text, "reports.html", "tool:reports"); }
            }
            if (options.onChange) options.onChange("tool:reports");
            return;
        }

        // گزارش جدید (فقط مدیرانی که اجازهٔ دیدن دارند رویداد را می‌گیرند)
        if (row && row.record_type === "report" && (event.events || []).some(name => /\.create$/.test(name))) {
            if (ChatPrefs.isMuted("tool:reports")) return;
            setUnread("tool:reports", getUnread("tool:reports") + 1);
            ping(true);
            buzz(true);
            if (!document.hidden) {
                banner({ title: "🛡️ گزارش جدید", text: "یک پیام گزارش شد؛ برای بررسی لمس کن.", href: "reports.html", letter: "🛡️" });
            } else {
                startFlash();
                systemNotify("🛡️ گزارش جدید", "یک پیام گزارش شد.", "reports.html", "tool:reports");
            }
            if (options && options.onChange) options.onChange("tool:reports");
            return;
        }

        if (!row || row.record_type !== "message" || !me || row.owner_id === me) return;
        if (!(event.events || []).some(name => /\.create$/.test(name))) return;

        const route = routeOf(row);
        if (!route) return;

        const key = row.group_id;
        const preview = previewOf(row);
        const visible = !document.hidden;
        const muted = ChatPrefs.isMuted(key);

        // گفت‌وگوی بی‌صدا: فقط شمارنده بالا می‌رود
        if (muted) {
            if (options.viewingKey === key && visible) markRead(key, row.$createdAt);
            else setUnread(key, getUnread(key) + 1);
            if (options.onChange) options.onChange(key);
            return;
        }

        if (options.viewingKey === key) {
            if (visible) {
                markRead(key, row.$createdAt);
                ping(false);
                buzz(false);
            } else {
                setUnread(key, getUnread(key) + 1);
                ping(true);
                buzz(true);
                startFlash();
                systemNotify(route.title, preview, route.href, key);
            }
        } else {
            setUnread(key, getUnread(key) + 1);
            ping(true);
            buzz(true);
            if (visible) banner({ title: route.title, text: preview, href: route.href, letter: route.letter });
            else { startFlash(); systemNotify(route.title, preview, route.href, key); }
        }

        if (options.onChange) options.onChange(key);
    }

    /* ---------- شمارش پیام‌های خوانده‌نشده از سرور ---------- */

    // latest: { key: زمان آخرین پیام } برای رد کردن گفت‌وگوهایی که چیز تازه‌ای ندارند
    async function recount(keys, options) {
        options = options || {};
        const latest = options.latest || {};

        await Promise.all(keys.map(async key => {
            try {
                const last = getLastRead(key);

                if (!last && options.firstTime !== "all") { markRead(key); return; }
                if (last && latest[key] && latest[key] <= last) { setUnread(key, 0); return; }

                const queries = [Appwrite.Query.equal("group_id", [key])];
                if (last) queries.push(Appwrite.Query.greaterThan("$createdAt", last));
                queries.push(Appwrite.Query.limit(50));

                const result = await appwriteTablesDB.listRows({
                    databaseId: APPWRITE_DATABASE_ID,
                    tableId: APPWRITE_TABLE_ID,
                    queries
                });

                const n = result.rows.filter(r => r.record_type === "message" && r.owner_id !== me).length;
                setUnread(key, n);
            } catch (error) {
                console.warn("recount failed", key, error && error.message);
            }
        }));
    }

    /* ---------- نشان روی آیتم‌های فهرست ---------- */

    function paintBadges(root) {
        (root || document).querySelectorAll("[data-key]").forEach(item => {
            const count = getUnread(item.dataset.key);
            const badge = item.querySelector(".unread-badge");
            if (!badge) return;

            if (count > 0) {
                badge.hidden = false;
                badge.textContent = count > 99 ? "۹۹+" : count.toLocaleString("fa-IR");
                item.classList.add("has-unread");
            } else {
                badge.hidden = true;
                item.classList.remove("has-unread");
            }
        });
    }


    return {
        enablePush, pushSupported,
        init, setBaseTitle, getUnread, getLastRead, setUnread, markRead,
        totalUnread, handleRealtime, recount, paintBadges, permissionBar,
        stopFlash, ping, buzz, previewOf
    };
})();

</script>
<script>
"use strict";

(async function () {
    const $ = id => document.getElementById(id);

    /* ---------- ورود ---------- */

    let account;
    try {
        account = await appwriteAccount.get();
    } catch (_) {
        localStorage.removeItem("loggedIn");
        localStorage.removeItem("memoryUser");
        window.location.replace("login.html");
        return;
    }

    const me = account.$id;
    const labels = account.labels || [];
    const isAdmin = me === ADMIN_USER_ID;
    const ringKey = labels.find(l => /^ring[1-5]$/.test(l)) || "";
    const isManager = labels.some(l => /^manager[1-5]$/.test(l));

    let profile = {};

    /* ---------- نمایش ---------- */

    function paintAvatarNow() {
        const el = $("avatarBtn");
        el.classList.remove("has-img");
        el.style.backgroundImage = "";
        $("avatarLetter").textContent = (profile.name || account.name || "؟").trim().charAt(0);

        if (profile.avatar) {
            fileBlobUrl(profile.avatar).then(url => {
                el.style.backgroundImage = 'url("' + url + '")';
                el.classList.add("has-img");
            }).catch(() => {});
        }
    }

    function render() {
        const name = account.name || profile.name || "کاربر";
        $("pfName").textContent = name;
        $("pfUn").textContent = profile.un ? "@" + profile.un : "";
        $("pfUnText").textContent = profile.un ? "@" + profile.un : "ثبت نشده";
        $("pfBio").textContent = profile.bio || "ثبت نشده";

        const phone = (account.prefs && account.prefs.phone) ||
            (account.email || "").replace("@fani.com", "") || profile.ph || "";
        $("pfPhone").textContent = phone || "—";

        $("pfJoin").textContent = account.registration
            ? new Date(account.registration).toLocaleDateString("fa-IR", { year: "numeric", month: "long", day: "numeric" })
            : "—";

        $("pfRing").textContent = isAdmin ? "همهٔ حلقه‌ها" : (RING_NAMES[ringKey] || "بدون حلقه");
        $("pfRole").textContent = isAdmin ? "مدیر کل" : (isManager ? "مدیر حلقه" : "");
        $("swHidePhone").checked = !!profile.hp;

        paintAvatarNow();
    }

    async function loadProfile() {
        profileCache.delete(me);
        await loadProfiles([me]);
        profile = profileCache.get(me) || {};
        // ph در کش برای خود فرد هم خالی می‌شود اگر پنهان باشد؛ شماره را از حساب می‌خوانیم
        render();
    }

    // ورودی متن (بیوگرافی، آیدی)
    function askText(options) {
        return new Promise(resolve => {
            const overlay = ui("div", "pc-overlay");
            const card = ui("div", "pc-card");
            card.style.textAlign = "right";

            const title = ui("h2", "", options.title);
            title.style.textAlign = "center";

            const field = ui(options.multiline ? "textarea" : "input", "pf-field");
            if (!options.multiline) field.type = "text";
            if (options.multiline) field.rows = 4;
            field.maxLength = options.maxLength || 100;
            field.value = options.value || "";
            field.placeholder = options.placeholder || "";
            if (options.ltr) { field.dir = "ltr"; field.autocapitalize = "none"; field.autocomplete = "off"; }

            const help = ui("p", "pf-help", options.help || "");

            const save = ui("button", "pc-dm", "ذخیره"); save.type = "button";
            const cancel = ui("button", "pc-dm pc-secondary", "انصراف"); cancel.type = "button";

            card.append(title, field, help, save, cancel);
            overlay.appendChild(card);
            document.body.appendChild(overlay);
            field.focus();

            const done = value => { closeOverlay(overlay); resolve(value); };
            cancel.addEventListener("click", () => done(null));
            overlay.addEventListener("click", event => { if (event.target === overlay) done(null); });

            save.addEventListener("click", async () => {
                save.disabled = true;
                help.classList.remove("bad");
                try {
                    await options.onSave(field.value.trim());
                    done(true);
                } catch (error) {
                    help.textContent = error.message || "ذخیره نشد.";
                    help.classList.add("bad");
                    save.disabled = false;
                }
            });
        });
    }

    /* ---------- بیوگرافی و آیدی ---------- */

    $("rowBio").addEventListener("click", async () => {
        const ok = await askText({
            title: "بیوگرافی", multiline: true, maxLength: 150, value: profile.bio || "",
            placeholder: "چند کلمه دربارهٔ خودت...", help: "حداکثر ۱۵۰ کاراکتر",
            onSave: async value => { await callServer({ action: "updateProfile", bio: value }); }
        });
        if (ok) { await loadProfile(); appToast("بیوگرافی ذخیره شد.", true); }
    });

    $("rowUn").addEventListener("click", async () => {
        const ok = await askText({
            title: "آیدی", maxLength: 20, ltr: true, value: profile.un || "", placeholder: "my_id",
            help: "۳ تا ۲۰ حرف انگلیسی، عدد یا _ ؛ با حرف شروع شود.",
            onSave: async value => {
                const un = value.replace(/^@/, "").toLowerCase();
                if (!/^[a-z][a-z0-9_]{2,19}$/.test(un)) throw new Error("آیدی معتبر نیست.");
                await callServer({ action: "setUsername", username: un });
            }
        });
        if (ok) { await loadProfile(); appToast("آیدی ثبت شد.", true); }
    });

    $("swHidePhone").addEventListener("change", async event => {
        const on = event.target.checked;
        try {
            await callServer({ action: "updateProfile", hidePhone: on });
            appToast(on ? "شمارهٔ تو دیگر نمایش داده نمی‌شود." : "شمارهٔ تو در اطلاعات نمایش داده می‌شود.", true);
        } catch (error) {
            event.target.checked = !on;
            appToast(error.message || "ذخیره نشد.");
        }
    });

    /* ---------- عکس پروفایل (با برش) ---------- */

    function openCrop(file) {
        return new Promise(resolve => {
            const AREA = 260;
            const url = URL.createObjectURL(file);

            const overlay = ui("div", "pc-overlay");
            const card = ui("div", "pc-card");
            const title = ui("h2", "", "برش عکس");
            const area = ui("div", "pf-crop-area");
            const img = new Image();
            img.src = url;
            area.appendChild(img);

            const zoom = ui("input", "pf-zoom");
            zoom.type = "range"; zoom.min = 1; zoom.max = 3; zoom.step = 0.01; zoom.value = 1;

            const save = ui("button", "pc-dm", "ذخیره"); save.type = "button";
            const cancel = ui("button", "pc-dm pc-secondary", "انصراف"); cancel.type = "button";
            card.append(title, area, zoom, save, cancel);
            overlay.appendChild(card);
            document.body.appendChild(overlay);

            let base = 1, scale = 1, x = 0, y = 0;

            const clamp = () => {
                const w = img.naturalWidth * scale, h = img.naturalHeight * scale;
                x = Math.min(0, Math.max(AREA - w, x));
                y = Math.min(0, Math.max(AREA - h, y));
            };
            const paint = () => {
                clamp();
                img.style.width = img.naturalWidth * scale + "px";
                img.style.height = img.naturalHeight * scale + "px";
                img.style.transform = "translate(" + x + "px," + y + "px)";
            };

            img.onload = () => {
                base = Math.max(AREA / img.naturalWidth, AREA / img.naturalHeight);
                scale = base;
                x = (AREA - img.naturalWidth * scale) / 2;
                y = (AREA - img.naturalHeight * scale) / 2;
                paint();
            };

            zoom.addEventListener("input", () => {
                const cx = (AREA / 2 - x) / scale, cy = (AREA / 2 - y) / scale;
                scale = base * Number(zoom.value);
                x = AREA / 2 - cx * scale;
                y = AREA / 2 - cy * scale;
                paint();
            });

            let drag = null;
            area.addEventListener("pointerdown", event => {
                drag = { px: event.clientX, py: event.clientY, x, y };
                area.setPointerCapture(event.pointerId);
            });
            area.addEventListener("pointermove", event => {
                if (!drag) return;
                x = drag.x + (event.clientX - drag.px);
                y = drag.y + (event.clientY - drag.py);
                paint();
            });
            const endDrag = () => { drag = null; };
            area.addEventListener("pointerup", endDrag);
            area.addEventListener("pointercancel", endDrag);

            const done = blob => { URL.revokeObjectURL(url); closeOverlay(overlay); resolve(blob); };
            cancel.addEventListener("click", () => done(null));

            save.addEventListener("click", () => {
                const canvas = document.createElement("canvas");
                canvas.width = canvas.height = 512;
                const side = AREA / scale;
                canvas.getContext("2d").drawImage(img, -x / scale, -y / scale, side, side, 0, 0, 512, 512);
                canvas.toBlob(blob => done(blob), "image/jpeg", 0.86);
            });
        });
    }

    async function chooseAndUpload() {
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";

        input.addEventListener("change", async () => {
            const file = input.files[0];
            if (!file) return;

            const blob = await openCrop(file);
            if (!blob) return;

            try {
                appToast("در حال ذخیره عکس...", true);
                const fileId = await uploadToBucket(new File([blob], "avatar.jpg", { type: "image/jpeg" }));
                await callServer({ action: "updateProfile", avatarFileId: fileId });
                await loadProfile();
                appToast("عکس پروفایل تغییر کرد.", true);
            } catch (error) {
                appToast(error.message || "عکس ذخیره نشد.");
            }
        });
        input.click();
    }

    $("changePhoto").addEventListener("click", chooseAndUpload);

    $("avatarBtn").addEventListener("click", () => {
        const items = [];
        if (profile.avatar) {
            items.push({
                icon: "🖼️", label: "مشاهدهٔ عکس",
                run: async () => { try { openImageViewer(await fileBlobUrl(profile.avatar), "profile", profile.avatar); } catch (_) {} }
            });
        }
        items.push({ icon: "📷", label: "تغییر عکس", run: chooseAndUpload });
        if (profile.avatar) {
            items.push({
                icon: "🗑️", label: "حذف عکس", danger: true,
                run: async () => {
                    try { await callServer({ action: "updateProfile", removeAvatar: true }); await loadProfile(); appToast("عکس حذف شد.", true); }
                    catch (error) { appToast(error.message || "حذف نشد."); }
                }
            });
        }
        showSheet("", items);
    });

    /* ---------- اعلان‌ها و صدا ---------- */

    function paintNotifState() {
        const state = $("notifState");
        const btn = $("notifBtn");
        btn.hidden = true;

        if (!("Notification" in window)) {
            state.textContent = "این مرورگر از اعلان پشتیبانی نمی‌کند.";
        } else if (Notification.permission === "granted") {
            state.textContent = "فعال است ✅ (حتی وقتی برنامه بسته است)";
        } else if (Notification.permission === "denied") {
            state.textContent = "مسدود شده؛ از تنظیمات مرورگر اجازه بده.";
        } else {
            state.textContent = "غیرفعال";
            btn.hidden = false;
        }
    }
    paintNotifState();

    $("notifBtn").addEventListener("click", async () => {
        try { await Notification.requestPermission(); } catch (_) {}
        paintNotifState();
        if (Notification.permission === "granted") {
            const ok = await Notifier.enablePush();
            appToast(ok ? "اعلان گوشی فعال شد." : "اعلان فعال شد؛ اما ثبت اعلان گوشی ناموفق بود.", ok);
        }
    });

    [["swSound", "sound"], ["swVibrate", "vibrate"], ["swBanner", "banner"]].forEach(([id, key]) => {
        $(id).checked = AppSettings.get(key, true);
        $(id).addEventListener("change", event => AppSettings.set(key, event.target.checked));
    });

    $("testNotif").addEventListener("click", () => {
        Notifier.ping(true);
        Notifier.buzz(true);
        appToast("این یک آزمایش است 🔔", true);
        if ("Notification" in window && Notification.permission === "granted") {
            try { new Notification("حلقات صالحین", { body: "اعلان آزمایشی" }); } catch (_) {}
        }
    });

    /* ---------- ظاهر ---------- */

    const swDark = $("swDark");
    swDark.checked = localStorage.getItem("darkMode") === "1";
    swDark.addEventListener("change", () => {
        localStorage.setItem("darkMode", swDark.checked ? "1" : "0");
        AppTheme.apply();
    });

    const colorsBox = $("pfColors");
    function paintColors() {
        const current = localStorage.getItem("themeColor") || "green";
        colorsBox.replaceChildren();
        Object.entries(AppTheme.THEMES).forEach(([name, t]) => {
            const b = ui("button", "pf-color" + (name === current ? " active" : ""));
            b.type = "button";
            b.style.background = t.g;
            b.setAttribute("aria-label", name);
            b.addEventListener("click", () => {
                localStorage.setItem("themeColor", name);
                AppTheme.apply();
                paintColors();
            });
            colorsBox.appendChild(b);
        });
    }
    paintColors();

    /* ---------- خروج ---------- */

    $("logoutBtn").addEventListener("click", () => {
        showSheet("از حساب خارج می‌شوی؟", [{
            icon: "🚪", label: "بله، خروج", danger: true,
            run: async () => {
                try {
                    const reg = await navigator.serviceWorker.getRegistration();
                    const sub = reg && await reg.pushManager.getSubscription();
                    if (sub) {
                        await callServer({ action: "removePush", endpoint: sub.endpoint }).catch(() => {});
                        await sub.unsubscribe().catch(() => {});
                    }
                } catch (_) {}

                try { await appwriteAccount.deleteSession({ sessionId: "current" }); } catch (_) {}
                localStorage.removeItem("loggedIn");
                localStorage.removeItem("memoryUser");
                window.location.replace("login.html");
            }
        }]);
    });

    /* ---------- شروع ---------- */

    localStorage.setItem("memoryUser", JSON.stringify({
        name: account.name || "",
        phone: (account.prefs && account.prefs.phone) || "",
        email: ""
    }));
    localStorage.setItem("loggedIn", "true");

    render();
    await loadProfile();

    // عکس و بیوگرافی قدیمی (ذخیره‌شده در حساب) یک بار برای بقیه منتشر می‌شود
    if (typeof ensurePublicProfileSynced === "function") ensurePublicProfileSynced(account.prefs || {});
})();

</script>

</body>
</html>
